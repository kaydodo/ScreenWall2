<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 200px;
            height: 360px;
            overflow: hidden;
            background-color: white;
        }
        
        #container {
            width: 200px;
            height: 360px;
            position: relative;
        }
        
        #qrcode {
            width: 200px;
            height: 360px;
            object-fit: contain;
            display: none;
        }
        
        #screen {
            width: 200px;
            height: 360px;
            position: absolute;
            top: 0;
            left: 0;
            background-color: white;
        }
    </style>
</head>
<body>
    <div id="container">
        <img id="qrcode" src="/qrcode/last_qrcode.png" alt="QR Code">
        <div id="screen"></div>
    </div>

    <script>
        const qrcodeImg = document.getElementById('qrcode');
        const screen = document.getElementById('screen');
        let lastModifiedTime = null;
        let isShowingQrcode = false;
        let timer = null;

        async function checkImageUpdate() {
            try {
                const response = await fetch('/qrcode/last_qrcode.png?' + Date.now(), { method: 'HEAD' });
                
                if (response.ok) {
                    const currentModified = response.headers.get('Last-Modified');
                    
                    if (currentModified && currentModified !== lastModifiedTime) {
                        lastModifiedTime = currentModified;
                        showQrcode();
                    }
                }
            } catch (e) {
                console.error('检查图片更新失败:', e);
            }
        }

        function showQrcode() {
            if (isShowingQrcode) return;
            
            isShowingQrcode = true;
            qrcodeImg.style.display = 'block';
            screen.style.display = 'none';
            
            qrcodeImg.src = '/qrcode/last_qrcode.png?' + Date.now();
            
            clearTimeout(timer);
            timer = setTimeout(() => {
                showWhiteScreen();
            }, 5000);
        }

        function showWhiteScreen() {
            isShowingQrcode = false;
            qrcodeImg.style.display = 'none';
            screen.style.display = 'block';
        }

        showWhiteScreen();
        setInterval(checkImageUpdate, 500);
    </script>
</body>
</html>
