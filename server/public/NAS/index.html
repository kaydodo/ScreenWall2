<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAS 存储中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .description {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            border: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .link-section {
            margin-top: 20px;
        }
        
        .direct-link {
            display: inline-block;
            color: #667eea;
            text-decoration: underline;
            font-size: 14px;
            margin-top: 15px;
        }
        
        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
        }
        
        .info h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .info ul {
            list-style: none;
            color: #666;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .info li::before {
            content: "•";
            color: #667eea;
            font-weight: bold;
            margin-right: 8px;
        }
        
        .credentials {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
        }
        
        .credentials strong {
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">💾</div>
        <h1>NAS 存储中心</h1>
        <p class="description">
            访问您的私有云存储，管理文件、照片、视频等资源
        </p>
        <a href="http://127.0.0.1:5244" target="_blank" class="btn">
            打开 NAS 存储中心
        </a>
        
        <div class="link-section">
            <a href="http://127.0.0.1:5244" target="_blank" class="direct-link">
                直接访问链接: http://127.0.0.1:5244
            </a>
        </div>
        
        <div class="info">
            <h3>📋 使用说明</h3>
            
            <div class="credentials">
                <strong>登录信息：</strong><br>
                管理员账号：wangbo5<br>
                管理员密码：qqww5566A@
            </div>
            
            <ul>
                <li>点击上方按钮或链接打开存储管理页面</li>
                <li>首次使用请在后台配置 E 盘挂载</li>
                <li>挂载路径：E:\ → 映射到 /E盘</li>
            </ul>
        </div>
    </div>
</body>
</html>
