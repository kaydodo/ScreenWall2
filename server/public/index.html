<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屏幕墙 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #e8f0fe 0%, #c2d9f8 50%, #a8c0ff 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  .login-card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 48px 40px;
    width: 400px;
    box-shadow: 0 20px 60px rgba(80,120,200,0.18), 0 4px 16px rgba(80,120,200,0.08);
    text-align: center;
  }
  .login-icon {
    font-size: 52px;
    margin-bottom: 12px;
    display: block;
  }
  .login-title {
    font-size: 26px;
    font-weight: 800;
    color: #1e3a8a;
    margin-bottom: 6px;
    letter-spacing: 3px;
  }
  .login-sub {
    font-size: 13px;
    color: #6b82b8;
    margin-bottom: 36px;
    letter-spacing: 1px;
  }
  .form-group {
    margin-bottom: 18px;
    text-align: left;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #3b4998;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .form-group input {
    width: 100%;
    height: 46px;
    border: 2px solid #dde5ff;
    border-radius: 14px;
    padding: 0 16px;
    font-size: 15px;
    color: #1e2a3a;
    background: #f8faff;
    transition: border-color 0.25s, box-shadow 0.25s;
    outline: none;
    font-family: inherit;
  }
  .form-group input:focus {
    border-color: #4f8ef7;
    box-shadow: 0 0 0 4px rgba(79,142,247,0.15);
    background: #fff;
  }
  .form-group input::placeholder { color: #a0aec0; }
  .login-btn {
    width: 100%;
    height: 50px;
    background: linear-gradient(135deg, #4f8ef7, #6c63ff);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 6px 20px rgba(79,142,247,0.35);
    margin-top: 8px;
    font-family: inherit;
  }
  .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(79,142,247,0.4); }
  .login-btn:active { transform: translateY(0); }
  .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
  .login-error {
    color: #e53e3e;
    font-size: 12px;
    margin-top: 10px;
    min-height: 18px;
    font-weight: 600;
  }
  .login-footer {
    margin-top: 24px;
    font-size: 11px;
    color: #a0aec0;
  }
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="login-card">
  <span class="login-icon">🖥️</span>
  <div class="login-title">屏幕墙</div>
  <div class="login-sub">SCREEN WALL MONITOR SYSTEM</div>

  <div class="form-group">
    <label for="username">账 号</label>
    <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" />
  </div>
  <div class="form-group">
    <label for="password">密 码</label>
    <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
  </div>
  <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
  <div class="login-error" id="errorMsg"></div>
  <div class="login-footer">ScreenWall v1.0 &nbsp;·&nbsp; 企业级屏幕监控系统</div>
</div>

<script>
const errorMsg = document.getElementById('errorMsg');
const loginBtn = document.getElementById('loginBtn');

function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (!u || !p) {
    errorMsg.textContent = '请输入用户名和密码';
    return;
  }
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<span class="spinner"></span>验证中...';
  errorMsg.textContent = '';

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p }),
  })
  .then(r => r.json())
  .then(data => {
    if (data.ok) {
      sessionStorage.setItem('sw_session', data.sessionId);
      sessionStorage.setItem('sw_user', u);
      window.location.href = '/main.html';
    } else {
      errorMsg.textContent = data.msg || '登录失败';
      loginBtn.disabled = false;
      loginBtn.textContent = '登 录';
    }
  })
  .catch(() => {
    errorMsg.textContent = '网络错误，请检查服务端';
    loginBtn.disabled = false;
    loginBtn.textContent = '登 录';
  });
}

// 自动验证 session
(function checkSession() {
  const sid = sessionStorage.getItem('sw_session');
  if (!sid) return;
  fetch(`/api/check?sessionId=${encodeURIComponent(sid)}`)
    .then(r => r.json())
    .then(data => {
      if (data.ok) window.location.href = '/main.html';
      else sessionStorage.clear();
    })
    .catch(() => sessionStorage.clear());
})();
</script>
</body>
</html>
