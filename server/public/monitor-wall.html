<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="屏幕墙监控墙，多设备同屏实时监控">
<meta name="robots" content="noindex, nofollow">
<title>监控墙</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
.wall-container {
  width: 100%;
  height: 100%;
  display: grid;
  gap: 2px;
  padding: 2px;
  background: #000;
}
.wall-cell {
  position: relative;
  background: #1a1d27;
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  cursor: pointer;
}
/* 双层结构：外层 img-wrapper 用 cover 切掉多余，内层 img 用 contain 完整显示 */
.wall-cell .img-wrapper {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}
.wall-cell .img-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  margin: auto;
}
.wall-cell.empty {
  display: flex;
  align-items: center;
  justify-content: center;
}
.wall-cell.empty::after {
  content: "无信号";
  color: #4a4a4a;
  font-size: 14px;
}
/* 时间戳 - 左上 */
.wall-timestamp {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 14px;
  padding: 4px 10px;
  border-radius: 4px;
  font-family: "Consolas", monospace;
}
/* 标题信息 - 右下 */
.wall-info {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 4px;
  text-align: right;
}
.wall-info .name {
  font-weight: 600;
}
.wall-info .detail {
  font-size: 11px;
  opacity: 0.8;
}
/* 离线状态 */
.wall-cell.offline img {
  filter: grayscale(100%);
  opacity: 0.5;
}
/* 删除状态 - 优先级高于离线 */
.wall-cell.deleted img {
  filter: grayscale(100%) blur(2px);
  opacity: 0.3;
}
.wall-cell .offline-badge {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(80, 90, 110, 0.82);
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  display: none;
  z-index: 5;
}
.wall-cell.offline .offline-badge {
  display: block;
}
.wall-cell.deleted .offline-badge {
  display: flex !important;
  background: rgba(180, 50, 50, 0.9) !important;
}
/* 浮动UU远程按钮 */
.uu-float-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(79, 126, 247, 0.92);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 5px;
  box-shadow: 0 4px 16px rgba(79, 126, 247, 0.4);
  transition: all 0.2s;
  z-index: 6;
  white-space: nowrap;
}
.uu-float-btn:hover {
  background: rgba(60, 100, 230, 1);
  transform: translate(-50%, -50%) scale(1.05);
  box-shadow: 0 6px 20px rgba(79, 126, 247, 0.5);
}
.wall-cell:hover .uu-float-btn {
  display: flex;
}
.uu-float-btn.hidden {
  display: none !important;
}

/* 缩放比例显示 */
.wall-zoom-level {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  z-index: 10;
  transition: opacity 0.3s;
  pointer-events: none;
}

/* ── 全屏隐藏 ─────────────────────────── */
.wall-cell.hidden {
  display: none;
}

/* ── 性能统计面板 ─────────────────────────── */
.stats-panel {
  position: fixed;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.8);
  color: #0f0;
  font-family: "Consolas", monospace;
  font-size: 11px;
  padding: 6px 10px;
  border-radius: 4px;
  z-index: 100;
  pointer-events: none;
  line-height: 1.6;
}

/* ═══════════════════════════════════════════════════════════════ */
/* 预览弹窗样式 — 完全照搬主页面 */
/* ═══════════════════════════════════════════════════════════════ */
.wall-preview-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(10,12,20,0.88);
  display: none;
  flex-direction: column;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.wall-preview-overlay.active {
  display: flex;
}
.wall-preview-titlebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.wall-preview-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

#wallPreviewDeviceName {
  font-size: 15px;
  font-weight: 700;
  color: #e2e8f0;
}

.wall-preview-btn {
  background: #2a2d3a;
  border: 1px solid #444;
  color: #fff;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
.wall-preview-btn:hover {
  background: #3a3d4a;
}
.wall-preview-btn.uu-btn {
  background: #4f7ef7;
  border-color: #4f7ef7;
}
.wall-preview-btn.uu-btn:hover {
  background: #3c64e6;
}
.wall-preview-btn.uu-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  pointer-events: none;
}
.wall-preview-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
  width: 100%;
}
.wall-preview-img-wrapper {
  position: absolute;
  top: 16px;
  left: 0;
  right: 0;
  bottom: 0;
}
.wall-preview-img-wrapper img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 0;
  box-shadow: none;
  border: none;
}
.wall-preview-offline-watermark {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-15deg) scale(3);
  font-size: 52px;
  font-weight: 300;
  color: rgba(160,160,160,0.7);
  pointer-events: none;
  white-space: nowrap;
  text-shadow: 0 0 30px rgba(255,255,255,0.4);
}
.wall-preview-mouse-hint {
  display: none;
  color: #aaa;
  font-size: 13px;
}

/* ── 远控设备列表弹窗 ──────────────────────── */
.remote-list-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10002;
}
.remote-list-dialog {
  position: fixed;
  background: #1a1d27;
  border: 1px solid #3a3d45;
  border-radius: 10px;
  padding: 12px;
  max-height: 60vh;
  overflow-y: auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  min-width: 200px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

/* ═══════════════════════════════════════════════════════════════ */
/* 键盘弹窗样式 — 照搬主页面 */
/* ═══════════════════════════════════════════════════════════════ */
.keyboard-overlay {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10001;
  display: none;
  align-items: center;
  justify-content: center;
}
.keyboard-container {
  background: #1a1d27;
  border-radius: 12px;
  padding: 12px;
  max-width: 1200px;
  width: 98%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  user-select: none;
}
.keyboard-layout {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}
.keyboard-section {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.main-section {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.edit-section {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding-top: 0;
}
.numpad-grid {
  display: grid;
  grid-template-columns: repeat(4, 32px);
  grid-template-rows: repeat(5, 32px);
  grid-auto-rows: 32px;
  gap: 3px;
  justify-content: flex-start;
  height: auto;
}
.kb-row {
  display: flex;
  gap: 3px;
  align-items: flex-end;
}
.kb-keys {
  display: flex;
  gap: 3px;
}
.kb-key {
  min-width: 32px;
  height: 32px;
  background: #2a2d35;
  border: 1px solid #3a3d45;
  border-radius: 4px;
  color: #fff;
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  align-self: stretch;
  text-transform: uppercase;
  transition: all 0.1s;
}
.numpad-grid .kb-key {
  height: auto;
  align-self: auto;
}
.kb-key:hover { background: #3a3d45; }
.kb-key:active { background: #4a4d55; transform: scale(0.95); }
.kb-key.shift-active { background: #5b8def !important; color: #fff !important; }
.kb-spacer { min-width: 3px; height: 32px; }
.edit-section .kb-row { height: 32px; }
</style>
</head>
<body>

<div class="wall-container" id="wallContainer"></div>
<div class="stats-panel" id="statsPanel"></div>

<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- 浮动关闭按钮：移到 previewOverlay 外部，z-index 最高 -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<div id="wallPreviewFloatingClose" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999999;pointer-events:none;">
  <button onclick="wallClosePreview()" style="position:absolute;top:12px;right:16px;color:#888;background:rgba(30,33,45,0.9);border:1px solid #444;font-size:14px;cursor:pointer;padding:6px 12px;border-radius:6px;pointer-events:auto;transition:all 0.2s;white-space:nowrap;">✕ 关闭</button>
</div>

<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- 预览弹窗 — 完全照搬主页面布局 -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<div class="wall-preview-overlay" id="wallPreviewOverlay">
  <div class="wall-preview-titlebar" id="wallPreviewTitlebar">
    <div style="display:flex;align-items:center;gap:30px;">
      <span id="wallPreviewDeviceName">实时预览</span>
      <!-- 远控开关和列表按钮，紧跟标题（和主页面完全一致） -->
      <div style="display:inline-flex;align-items:center;gap:4px;position:relative;z-index:10;" id="wallPreviewRemoteWrap">
        <div id="wallPreviewRemoteSlider" role="button" tabindex="0" aria-label="远控开关" onclick="event.stopPropagation();wallToggleRemote()" style="width:36px;height:18px;background:#555;border-radius:9px;position:relative;transition:background 0.2s;cursor:pointer;pointer-events:auto;">
          <div id="wallPreviewRemoteKnob" style="width:14px;height:14px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform 0.2s;"></div>
        </div>
        <span style="font-size:12px;color:#888;">远控</span>
        <button onclick="event.stopPropagation();wallToggleRemoteListModal()" title="远控设备列表" style="background:none;border:none;color:#888;font-size:14px;cursor:pointer;padding:2px;">🔍</button>
      </div>
    </div>
    <div class="wall-preview-controls">
      <div style="position:fixed;left:50%;transform:translateX(-50%);">
        <span class="wall-preview-mouse-hint" id="wallPreviewMouseHint" style="display:none;color:#aaa;font-size:13px;">📌 左键=点击/右键=菜单/滚轮=滚动</span>
        <button class="wall-preview-btn" id="wallPreviewMonitorBtn" title="切换显示器" onclick="wallCycleMonitor()" style="display:none;">🖥️ 显示器 1</button>
        <button class="wall-preview-btn" id="wallPreviewKBbtn" title="键盘控制" onclick="wallToggleKeyboard()">⌨️ 键盘</button>
      </div>
      <button class="wall-preview-btn uu-btn" id="wallPreviewUUbtn" title="打开UU远程"> 🖱️ UU远程</button>
    </div>
  </div>
  <div class="wall-preview-area" id="wallPreviewArea">
    <div class="wall-preview-img-wrapper" id="wallPreviewImgWrapper">
      <img id="wallPreviewImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="实时预览" style="border-radius:0;box-shadow:none;border:none;" />
    </div>
  </div>
  <div class="wall-preview-offline-watermark" id="wallPreviewOfflineWatermark">设备已离线</div>
</div>

<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- 远控设备列表弹窗 -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<div class="remote-list-overlay" id="wallRemoteListOverlay">
  <div class="remote-list-dialog" id="wallRemoteListDialog"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- 键盘弹窗 — 照搬主页面 -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<div class="keyboard-overlay" id="wallKeyboardOverlay" style="display:none;">
  <div class="keyboard-container" id="wallKeyboardContainer" style="background:#1a1d27;border-radius:12px;padding:12px;max-width:1200px;width:98%;box-shadow:0 8px 32px rgba(0,0,0,0.5);user-select:none;">
    <div id="wallKeyboardTitleBar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:move;">
      <span style="color:#fff;font-size:14px;">⌨️ 键盘控制</span>
      <button onclick="wallCloseKeyboard()" style="background:none;border:none;color:#888;cursor:pointer;font-size:18px;">✕</button>
    </div>
    <div id="wallKeyboardContent"></div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// 性能优化模块
// ═══════════════════════════════════════════════════════════════

// ── 5. 看门狗（增强版）───────────────────────────────────────
const watchdog = (function() {
  let _interval = null;
  let _lastUpdate = {};
  const TIMEOUT_MS = 3000;

  function start() {
    if (_interval) clearInterval(_interval);
    _interval = setInterval(check, 2000);
  }

  function touch(deviceId) {
    _lastUpdate[deviceId] = Date.now();
  }

  function check() {
    const now = Date.now();
    const expired = [];
    for (const deviceId in _lastUpdate) {
      if (now - _lastUpdate[deviceId] > TIMEOUT_MS) {
        const img = document.getElementById('img_' + deviceId);
        if (img && img.src) {
          const currentSrc = img.src;
          img.src = '';
          img.src = currentSrc;
        }
        expired.push(deviceId);
      }
    }
    for (let i = 0; i < expired.length; i++) {
      delete _lastUpdate[expired[i]];
    }
  }

  function stop() {
    if (_interval) { clearInterval(_interval); _interval = null; }
    _lastUpdate = {};
  }

  return { start, touch, stop };
})();

// ═══════════════════════════════════════════════════════════════
// 主程序
// ═══════════════════════════════════════════════════════════════

// 获取配置数据
var wallData = null;
var devices = {}; // deviceId -> { id, name, groupName, position, online, crop, groupId, ... }
var groups = [];  // 分组列表
try {
  var stored = sessionStorage.getItem('monitorWallData');
  if (stored) {
    wallData = JSON.parse(stored);
    sessionStorage.removeItem('monitorWallData'); // 清理
    // 初始化设备状态
    wallData.devices.forEach(function(d) {
      devices[d.id] = {
        id: d.id,
        uuDeviceId: d.uuDeviceId || null,
        name: d.name,
        groupName: d.groupName || '未分组',
        position: d.position,
        online: d.online !== undefined ? d.online : true,
        crop: d.crop,
        groupId: null,
        screenshot: d.screenshot || null,  // 保存截图用于离线显示
        supportsKeyClient: d.supportsKeyClient || false,
        monitorCount: d.monitorCount || 1,
        monitorIndex: d.monitorIndex || 1
      };
    });
  }
} catch(e) {}

if (!wallData) {
  document.body.innerHTML = '<div style="color:#fff;text-align:center;margin-top:40vh;font-size:16px;">未找到配置数据，请从主页面重新操作</div>';
}

// WebSocket 连接
var ws = null;
var subscribedDevices = []; // 订阅的设备列表

// ── Blob URL 管理（减少浏览器解码内存）────────────────────────────
var _wallBlobs = {}; // deviceId -> blobUrl
var _wallBlobMds = {}; // deviceId -> last md5

function _md5Hex(base64) {
  try {
    var raw = atob(base64.replace(/^data:image\/\w+;base64,/, ''));
    var bin = '';
    for (var i = 0; i < raw.length; i++) {
      var x = raw.charCodeAt(i) & 0xff;
      bin += ('0' + x.toString(16)).slice(-2);
    }
    return bin;
  } catch(e) { return null; }
}


function base64ToBlob(base64) {
  try {
    var mime = base64.match(/^data:image\/(\w+);base64,/);
    if (!mime) mime = 'image/jpeg';
    else mime = 'image/' + mime[1];
    var raw = atob(base64.replace(/^data:image\/\w+;base64,/, ''));
    var arr = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return new Blob([arr], { type: mime });
  } catch(e) { return null; }
}

function updateWallCellScreenshot(deviceId, screenshot) {
  var img = document.getElementById('img_' + deviceId);
  var dev = devices[deviceId];
  if (!img || !screenshot || !dev) return;

  var md5 = _md5Hex(screenshot);
  if (md5 && _wallBlobMds[deviceId] === md5) return; // 帧内容未变，跳过 DOM 更新
  _wallBlobMds[deviceId] = md5;

  // 释放旧 blob URL
  if (_wallBlobs[deviceId]) {
    URL.revokeObjectURL(_wallBlobs[deviceId]);
    _wallBlobs[deviceId] = null;
  }

  var blob = base64ToBlob(screenshot);
  if (!blob) return;
  var blobUrl = URL.createObjectURL(blob);
  _wallBlobs[deviceId] = blobUrl;

  // 帧到达：恢复透明度（首次到达时 opacity:0→1 淡入）
  if (img.style.opacity !== '1') img.style.opacity = '1';

  img.src = blobUrl;
  img.style.display = 'block';
  var crop = dev.crop || { scale: 1, translateX: 0, translateY: 0 };
  img.style.transform = 'scale(' + crop.scale + ') translate(' + (crop.translateX || 0) + 'px, ' + (crop.translateY || 0) + 'px)';
  img.style.transformOrigin = 'center center';
}

// ── 性能统计 ────────────────────────────────────────────────
var stats = {
  framesReceived: 0,
  framesRendered: 0,
  wsReconnects: 0,
  lastReport: performance.now()
};

// ── 自愈帧计数 ──────────────────────────────────────────────
var frameHealCount = new Map(); // deviceId -> count
var WALL_FRAME_HEAL_THRESHOLD = 2; // 至少收到2帧才恢复离线格子

function updateStats() {
  if (!wallData.debug) return;
  const now = performance.now();
  const elapsed = (now - stats.lastReport) / 1000;
  const fps = elapsed > 0 ? Math.round(stats.framesReceived / elapsed) : 0;
  document.getElementById('statsPanel').innerHTML =
    'FPS: ' + fps + '<br>' +
    'Recv: ' + stats.framesReceived + '<br>' +
    'Render: ' + stats.framesRendered + '<br>' +
    'Reconnects: ' + stats.wsReconnects;
  stats.framesReceived = 0;
  stats.lastReport = now;
}

// 紧凑布局行列配置（完全平方数用 NxN，非完全平方数自定义行列）
var compactLayouts = {
  6: { rows: 2, cols: 3 },   // 3x2
  12: { rows: 3, cols: 4 },  // 4x3
  20: { rows: 4, cols: 5 }   // 5x4
};

// 格子位置标签（三位数格式：001, 002, ...）
function getPositionLabel(index) {
  return String(index + 1).padStart(3, '0');
}

function initWall() {
  var container = document.getElementById('wallContainer');
  var cfg = compactLayouts[wallData.layout];
  var rows = cfg ? cfg.rows : Math.sqrt(wallData.layout);
  var cols = cfg ? cfg.cols : Math.sqrt(wallData.layout);
  container.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  container.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';

  // 保存订阅的设备列表
  subscribedDevices = wallData.devices.map(function(d) { return d.id; });

  // 创建格子
  for (var i = 0; i < wallData.layout; i++) {
    var cell = document.createElement('div');
    cell.className = 'wall-cell';
    cell.id = 'cell_' + i;

    if (i < wallData.devices.length) {
      var dev = wallData.devices[i];
      var devName = dev.name || dev.id || '未知设备';
      cell.innerHTML =
        '<div class="img-wrapper"><img id="img_' + dev.id + '" alt="监控画面: ' + devName + '" src="" class="wall-img-hidden"></div>' +
        '<div class="wall-zoom-level" id="zoom_' + dev.id + '">100%</div>' +
        '<div class="wall-timestamp" id="ts_' + dev.id + '">等待画面</div>' +
        '<div class="wall-info" id="info_' + dev.id + '">' +
          '<div class="name">' + devName + '</div>' +
          '<div class="detail">' + (dev.groupName || '未分组') + ' / 格' + getPositionLabel(dev.position - 1) + '</div>' +
        '</div>' +
        '<div class="offline-badge">设备已离线</div>';

      if (dev.online === false) {
        cell.classList.add('offline');
      }

      // 保存设备ID用于点击预览
      cell.deviceId = dev.id;
      cell.addEventListener('click', function(e) {
        // 拖拽后不触发点击事件
        if (this._justDragged) {
          this._justDragged = false;
          return;
        }
        wallOpenPreview(this.deviceId);
      });
    } else {
      cell.classList.add('empty');
    }

    container.appendChild(cell);
  }

  // 为所有格子添加滚轮放大和拖拽功能
  for (var i = 0; i < wallData.layout; i++) {
    var cell = document.getElementById('cell_' + i);
    if (!cell) continue;
    var devId = wallData.devices[i] ? wallData.devices[i].id : null;
    if (devId) {
      makeWallCellDraggable(cell, devId);
    }
  }

  // 开启统计面板（调试用）
  if (wallData.debug) {
    document.getElementById('statsPanel').style.display = 'block';
    setInterval(updateStats, 2000);
  }

  // 连接 WebSocket
  connectWebSocket();

  // 启动看门狗
  watchdog.start();

  // WebSocket 推送方案：初始化时在线格 opacity:0（黑色背景透出），离线格 opacity:0.4 显示静态图
  // 首帧到达后 opacity:0→1 淡入

  wallData.devices.forEach(function(dev) {
    var img = document.getElementById('img_' + dev.id);
    if (!img) return;

    if (dev.online === false) {
      // 离线设备：显示静态图
      if (dev.screenshot) img.src = dev.screenshot;
      img.style.display = 'block';
      img.style.opacity = '0.4';
    } else {
      // 在线设备：初始 opacity:0，等待首帧时黑色背景透出
      img.style.display = 'block';
      img.style.opacity = '0';
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'startHQ', deviceId: dev.id }));
      }
    }
  });

}

function connectWebSocket() {
  var wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/browser';
  ws = new WebSocket(wsUrl);
  ws.binaryType = "arraybuffer";

  ws.onopen = function() {
    console.log('[监控墙] WebSocket 连接成功，发送 subscribeWall', wallData.devices.map(function(d) { return d.id; }));
    // 连接成功，请求高清截图
    ws.send(JSON.stringify({
      type: 'subscribeWall',
      devices: wallData.devices.map(function(d) { return d.id; })
    }));
  };

  ws.onclose = function() {
    stats.wsReconnects++;
    // 重连
    setTimeout(connectWebSocket, 3000);
  };

  ws.onerror = function(err) {
    // console.error('WebSocket error:', err);
  };

  ws.onmessage = function(e) {
    // ── 二进制帧（server → 监控墙）──
    if (e.data instanceof ArrayBuffer) {
      try {
        const view = new DataView(e.data);
        const data = new Uint8Array(e.data);
        const frameType = data[0];
        // 0x12 = 监控墙格子帧（wall frame）
        if (frameType === 0x12) {
          const devIdLen = data[1];
          const flags = data[2];
          const isHQ = (flags & 0x01) !== 0;
          const screenWidth = view.getUint16(4);
          const screenHeight = view.getUint16(6);
          let off = 8;
          const devId = new TextDecoder().decode(new Uint8Array(e.data, off, devIdLen));
          off += devIdLen;
          const webpBuf = e.data.slice(off);
          const blob = new Blob([webpBuf], { type: 'image/webp' });
          const blobUrl = URL.createObjectURL(blob);

          // ★ 预览激活时停止格子渲染（和主页面一样）★★★
          if (!wallPreviewActive) {
            // 正常渲染格子
            const el = document.getElementById('img_' + devId);
            if (el) {
              if (el._blobUrl) URL.revokeObjectURL(el._blobUrl);
              el.src = blobUrl;
              el._blobUrl = blobUrl;
              el.classList.remove('wall-img-hidden');
              el.style.display = 'block';
              el.style.opacity = '1';
              // 更新左上角时间戳
              var tsEl = document.getElementById('ts_' + devId);
              if (tsEl) tsEl.textContent = formatDate(new Date());
            }
          } else {
            // 预览模式：不更新格子，但仍释放 blobUrl 防内存泄漏
            URL.revokeObjectURL(blobUrl);
          }

          // 同时更新预览弹窗（如果正在预览该设备）
          // ★ 即使格子不渲染，0x12 帧仍可作为预览画面（没有 0x11 时作为备选）★
          if (wallPreviewDeviceId === devId && !wallPreviewActive1080) {
            var previewImg = document.getElementById('wallPreviewImg');
            if (previewImg && devices[devId] && devices[devId].online) {
              // 0x12 帧只有在不走 0x11 通道时才用于预览
              // 如果已订阅了 0x11（1080p），则忽略 0x12 帧的预览更新
            }
          }
        }
        // 0x11 = 预览帧（1080p HQ preview）
        if (frameType === 0x11) {
          const devIdLen = data[1];
          const flags = data[2];
          const screenWidth = view.getUint16(4);
          const screenHeight = view.getUint16(6);
          let off = 8;
          const devId = new TextDecoder().decode(new Uint8Array(e.data, off, devIdLen));
          off += devIdLen;
          const webpBuf = e.data.slice(off);
          const blob = new Blob([webpBuf], { type: 'image/webp' });
          const blobUrl = URL.createObjectURL(blob);

          // 更新预览弹窗（如果正在预览该设备）
          if (wallPreviewDeviceId === devId) {
            var previewImg = document.getElementById('wallPreviewImg');
            if (previewImg && devices[devId] && devices[devId].online) {
              if (previewImg._blobUrl) URL.revokeObjectURL(previewImg._blobUrl);
              previewImg.src = blobUrl;
              previewImg._blobUrl = blobUrl;
              previewImg.style.display = 'block';
              previewImg.style.visibility = 'visible';
              previewImg.style.filter = '';
              // 隐藏离线水印
              var watermark = document.getElementById('wallPreviewOfflineWatermark');
              if (watermark) watermark.style.display = 'none';
            }
            // 保存设备分辨率用于鼠标点击映射
            if (screenWidth > 0 && screenHeight > 0) {
              wallPreviewScreenWidth = screenWidth;
              wallPreviewScreenHeight = screenHeight;
            }
          } else {
            // 不是当前预览设备，释放 blobUrl
            URL.revokeObjectURL(blobUrl);
          }
        }
      } catch(ex) {}
      return;
    }
    // ── JSON 消息 ──
    try {
      var data = JSON.parse(e.data);
      // 二进制0x12帧已负责动态画面，跳过JSON静态图路径
      if (data.type === 'wallScreenshot' || data.type === 'wallScreenshotBatch') return;

      if (data.type === 'wallStateUpdate') {
        handleWallStateUpdate(data);
      }

      if (data.type === 'walledDevices') {
        // console.log('[Wall] Subscribed devices:', data.devices);
      }

      // 键盘状态变更（远控开关状态变更广播）
      if (data.type === 'keyboardState') {
        var dev = devices[data.deviceId];
        if (dev) {
          dev.supportsKeyClient = data.supportsKeyClient;
          // 更新预览弹窗远控按钮状态
          if (wallPreviewDeviceId === data.deviceId) {
            wallUpdateRemoteBtn();
            // 如果远控被关闭且键盘弹窗开着，关掉键盘
            if (!data.supportsKeyClient && wallKeyboardOpen) {
              wallCloseKeyboard();
            }
            // 更新键盘按钮
            var kbBtn = document.getElementById('wallPreviewKBbtn');
            if (kbBtn) kbBtn.style.display = data.supportsKeyClient ? 'inline-flex' : 'none';
            // 更新鼠标提示
            wallUpdateMouseHint();
          }
        }
      }

      // previewScreenshot 和 browserScreenshot JSON 消息也更新预览弹窗
      if ((data.type === 'previewScreenshot' || data.type === 'browserScreenshot') && data.deviceId && data.image) {
        if (wallPreviewDeviceId === data.deviceId && devices[data.deviceId] && devices[data.deviceId].online) {
          var previewImg = document.getElementById('wallPreviewImg');
          if (previewImg) {
            var blob = base64ToBlob(data.image);
            if (blob) {
              var blobUrl = URL.createObjectURL(blob);
              if (previewImg._blobUrl) URL.revokeObjectURL(previewImg._blobUrl);
              previewImg.src = blobUrl;
              previewImg._blobUrl = blobUrl;
              previewImg.style.display = 'block';
              previewImg.style.visibility = 'visible';
              previewImg.style.filter = '';
              var watermark = document.getElementById('wallPreviewOfflineWatermark');
              if (watermark) watermark.style.display = 'none';
            }
          }
        }
        if (data.screenWidth && data.screenHeight) {
          wallPreviewScreenWidth = data.screenWidth;
          wallPreviewScreenHeight = data.screenHeight;
        }
      }
    } catch(err) {
      // console.error('Parse error:', err);
    }
  };
}

var wallPreviewDeviceId = null;   // 当前预览的设备ID
var wallPreviewActive = false;    // ★ 预览激活时暂停格子渲染（和主页面一样）
var wallPreviewActive1080 = false; // 1080p 预览模式
var wallPreviewScreenWidth = 1920;
var wallPreviewScreenHeight = 1080;
var wallKeyboardOpen = false;
var physicalShiftDown = false;
var _wallPendingRemoteState = null; // 远控开关预期状态

// ── 鼠标提示（照搬主页面）────────────────────────────────────
function wallUpdateMouseHint() {
  var hint = document.getElementById('wallPreviewMouseHint');
  if (!hint) return;
  // 显示条件：非移动端 + 有键盘支持 + 预览打开
  var dev = wallPreviewDeviceId ? devices[wallPreviewDeviceId] : null;
  var show = !isMobile() && dev && dev.supportsKeyClient;
  if (!show) {
    hint.style.display = 'none';
    return;
  }
  hint.textContent = '📌 左键=点击/右键=菜单/滚轮=滚动';
  hint.style.display = '';
}

// ── 远控开关（照搬主页面）────────────────────────────────────
function wallUpdateRemoteBtn() {
  var dev = wallPreviewDeviceId ? devices[wallPreviewDeviceId] : null;
  var slider = document.getElementById('wallPreviewRemoteSlider');
  var knob = document.getElementById('wallPreviewRemoteKnob');
  if (!slider || !knob) return;

  // 始终显示
  slider.style.opacity = '1';
  slider.style.cursor = 'pointer';

  // 设备离线时不更新按钮，保持当前状态
  if (dev && dev.online === false) return;

  var isEnabled = dev && dev.supportsKeyClient === true;
  if (isEnabled) {
    slider.style.background = '#22c55e'; // 绿色
    knob.style.transform = 'translateX(20px)';
  } else {
    slider.style.background = '#555'; // 灰色
    knob.style.transform = 'translateX(0)';
  }
}

function wallToggleRemote() {
  if (!wallPreviewDeviceId) return;
  var dev = devices[wallPreviewDeviceId];
  if (!dev || !dev.online) return;

  var slider = document.getElementById('wallPreviewRemoteSlider');
  var knob = document.getElementById('wallPreviewRemoteKnob');
  if (!slider || !knob) return;

  // 记录预期状态
  _wallPendingRemoteState = dev.supportsKeyClient !== true;

  // 立即执行最终状态的动画
  if (_wallPendingRemoteState) {
    slider.style.background = '#22c55e';
    knob.style.transform = 'translateX(20px)';
  } else {
    slider.style.background = '#555';
    knob.style.transform = 'translateX(0)';
  }

  // 发送指令
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: _wallPendingRemoteState ? 'setKeyboardEnabled' : 'setKeyboardDisabled',
      deviceId: wallPreviewDeviceId
    }));
  }

  // 关闭远控时关闭键盘弹窗
  if (!_wallPendingRemoteState && wallKeyboardOpen) {
    wallCloseKeyboard();
  }
}

// ── 远控设备列表弹窗（照搬主页面）────────────────────────────
function wallOpenRemoteListModal() {
  var overlay = document.getElementById('wallRemoteListOverlay');
  var content = document.getElementById('wallRemoteListDialog');

  // 获取所有在线设备，按名称排序
  var onlineDevices = [];
  for (var id in devices) {
    if (devices[id].online && !devices[id].deleted) {
      onlineDevices.push(devices[id]);
    }
  }
  onlineDevices.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });

  var html = '';
  onlineDevices.forEach(function(dev) {
    var isEnabled = dev.supportsKeyClient;
    var bgColor = isEnabled ? 'rgba(34,197,94,0.15)' : 'rgba(255,255,255,0.05)';
    var borderColor = isEnabled ? 'rgba(34,197,94,0.4)' : 'rgba(255,255,255,0.1)';
    var textColor = isEnabled ? '#22c55e' : '#888';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;background:' + bgColor + ';border:1px solid ' + borderColor + ';border-radius:6px;padding:10px 16px;font-size:14px;color:' + textColor + ';white-space:nowrap;gap:12px;"><span>' + (dev.name || dev.id) + '</span></div>';
  });
  content.innerHTML = html;

  // 弹窗定位到放大镜按钮下方
  var searchBtn = document.querySelector('#wallPreviewRemoteWrap button');
  if (searchBtn) {
    var rect = searchBtn.getBoundingClientRect();
    content.style.top = (rect.bottom + 8) + 'px';
    content.style.left = rect.left + 'px';
    content.style.transform = 'none';
    content.style.maxWidth = '80vw';
    requestAnimationFrame(function() {
      var dRect = content.getBoundingClientRect();
      if (dRect.right > window.innerWidth - 10) {
        content.style.left = (window.innerWidth - dRect.width - 10) + 'px';
      }
    });
  }

  overlay.style.display = 'block';
}

function wallCloseRemoteListModal() {
  document.getElementById('wallRemoteListOverlay').style.display = 'none';
}

function wallToggleRemoteListModal() {
  var overlay = document.getElementById('wallRemoteListOverlay');
  if (overlay.style.display === 'block') {
    wallCloseRemoteListModal();
  } else {
    wallOpenRemoteListModal();
  }
}

function wallOpenPreview(deviceId) {
  var dev = devices[deviceId];
  if (!dev) return;

  // 如果已有预览打开，先关闭旧的
  if (wallPreviewDeviceId && wallPreviewDeviceId !== deviceId) {
    wallClosePreview();
  }

  // 如果已经在预览同一设备，直接关闭
  if (wallPreviewDeviceId === deviceId) {
    wallClosePreview();
    return;
  }

  wallPreviewDeviceId = deviceId;
  var isOnline = dev.online;

  // ★ 激活预览模式：暂停格子渲染
  wallPreviewActive = true;
  wallPreviewActive1080 = true;

  // 设置标题
  var monSuffix = dev.monitorCount > 1 ? ' 🖥️' + dev.monitorIndex : '';
  document.getElementById('wallPreviewDeviceName').textContent = (dev.name || '未知') + ' - 实时预览' + monSuffix;

  // 清空旧帧
  var previewImg = document.getElementById('wallPreviewImg');
  var previewWrapper = document.getElementById('wallPreviewImgWrapper');
  previewWrapper.style.backgroundImage = '';
  if (previewImg._blobUrl) { URL.revokeObjectURL(previewImg._blobUrl); previewImg._blobUrl = null; }
  previewImg.style.display = 'none';
  previewImg.style.visibility = 'hidden';
  previewImg.style.filter = '';
  previewImg.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  // 显示弹窗
  document.getElementById('wallPreviewOverlay').classList.add('active');

  // 离线水印
  var watermark = document.getElementById('wallPreviewOfflineWatermark');
  if (!isOnline) {
    if (watermark) watermark.style.display = 'block';
    // 显示静态图
    if (dev.screenshot) {
      previewImg.src = dev.screenshot;
      previewImg.style.display = 'block';
      previewImg.style.visibility = 'visible';
      previewImg.style.filter = 'grayscale(100%) opacity(0.4)';
    }
  } else {
    if (watermark) watermark.style.display = 'none';
  }

  // UU按钮
  var uuBtn = document.getElementById('wallPreviewUUbtn');
  if (uuBtn) {
    if (dev.uuDeviceId && isOnline) {
      uuBtn.style.display = 'inline-flex';
      uuBtn.disabled = false;
      uuBtn.style.opacity = '';
      uuBtn.style.cursor = '';
      uuBtn.style.pointerEvents = '';
      uuBtn.onclick = function() { openUU(dev.uuDeviceId); };
    } else {
      uuBtn.style.display = 'inline-flex';
      uuBtn.disabled = true;
      uuBtn.style.opacity = '0.35';
      uuBtn.style.cursor = 'not-allowed';
      uuBtn.style.pointerEvents = 'none';
    }
  }

  // 键盘按钮
  var kbBtn = document.getElementById('wallPreviewKBbtn');
  if (kbBtn) {
    kbBtn.style.display = dev.supportsKeyClient ? 'inline-flex' : 'none';
  }

  // 多显示器按钮
  var monBtn = document.getElementById('wallPreviewMonitorBtn');
  if (monBtn) {
    if (dev.monitorCount > 1) {
      monBtn.style.display = 'inline-flex';
      monBtn.textContent = '🖥️ 显示器 ' + dev.monitorIndex;
    } else {
      monBtn.style.display = 'none';
    }
  }

  // 显示浮动关闭按钮
  var floatingClose = document.getElementById('wallPreviewFloatingClose');
  if (floatingClose) floatingClose.style.display = 'block';

  // 远控按钮：显示 + 更新状态
  var remoteWrap = document.getElementById('wallPreviewRemoteWrap');
  if (remoteWrap) remoteWrap.style.display = isMobile() ? 'none' : 'inline-flex';
  setTimeout(wallUpdateRemoteBtn, 100);

  // 在线设备：发送 hq1080On + 订阅预览通道（HQ流已由subscribeWall持有，无需再发startHQ）
  if (isOnline && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'hq1080On', deviceId: deviceId }));
    ws.send(JSON.stringify({ type: 'subscribePreview', deviceId: deviceId }));
  }

  // 绑定预览图片点击事件（仅桌面端，用于远控鼠标点击）
  if (!isMobile()) {
    previewImg.onclick = wallHandlePreviewClick;
    // 右键菜单禁用 + 滚轮远控
    var previewArea = document.getElementById('wallPreviewArea');
    if (previewArea) {
      previewArea.oncontextmenu = function(e) { e.preventDefault(); };
      previewArea.onwheel = function(e) {
        e.preventDefault();
        var d = devices[wallPreviewDeviceId];
        if (d && d.supportsKeyClient && d.online) {
          var delta = e.deltaY > 0 ? -120 : 120;
          wallSendMouse('mouseScroll', 0, 0, { delta: delta });
        }
      };
      previewArea.onmousedown = function(e) {
        if (e.button === 2) {
          e.preventDefault();
          var d = devices[wallPreviewDeviceId];
          if (d && d.supportsKeyClient && d.online) {
            var pos = wallGetClickPos(e);
            if (pos) wallSendMouse('mouseRight', pos.x, pos.y);
          }
        }
      };
    }
  }

  // 更新鼠标提示
  wallUpdateMouseHint();
}

function wallClosePreview() {
  if (!wallPreviewDeviceId) return;

  // 关闭1080p（HQ流保留，监控墙格子仍需要）
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'hq1080Off', deviceId: wallPreviewDeviceId }));
    ws.send(JSON.stringify({ type: 'unsubscribePreview', deviceId: wallPreviewDeviceId }));
  }

  // 关闭键盘弹窗
  if (wallKeyboardOpen) wallCloseKeyboard();

  // 关闭远控设备列表弹窗
  wallCloseRemoteListModal();

  // 隐藏远控按钮
  var remoteWrap = document.getElementById('wallPreviewRemoteWrap');
  if (remoteWrap) remoteWrap.style.display = 'none';

  // 隐藏浮动关闭按钮
  var floatingClose = document.getElementById('wallPreviewFloatingClose');
  if (floatingClose) floatingClose.style.display = 'none';

  // 隐藏弹窗
  document.getElementById('wallPreviewOverlay').classList.remove('active');

  // 清理预览图
  var previewImg = document.getElementById('wallPreviewImg');
  if (previewImg) {
    if (previewImg._blobUrl) { URL.revokeObjectURL(previewImg._blobUrl); previewImg._blobUrl = null; }
    previewImg.onclick = null;
    previewImg.style.display = 'none';
    previewImg.style.filter = '';
    previewImg.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  }

  // 清理事件
  var previewArea = document.getElementById('wallPreviewArea');
  if (previewArea) { previewArea.oncontextmenu = null; previewArea.onwheel = null; previewArea.onmousedown = null; }

  // 隐藏水印
  document.getElementById('wallPreviewOfflineWatermark').style.display = 'none';

  // 隐藏鼠标提示
  var hint = document.getElementById('wallPreviewMouseHint');
  if (hint) hint.style.display = 'none';

  // ★ 恢复格子渲染
  wallPreviewActive = false;
  wallPreviewActive1080 = false;
  wallPreviewDeviceId = null;
}

// ── 预览鼠标点击坐标映射 ────────────────────────────────────
function wallGetClickPos(e) {
  var img = document.getElementById('wallPreviewImg');
  if (!img) return null;
  var imgRect = img.getBoundingClientRect();
  if (imgRect.width === 0 || imgRect.height === 0) return null;
  var cw = imgRect.width;
  var ch = imgRect.height;
  var imgAspect = wallPreviewScreenWidth / wallPreviewScreenHeight;
  var imgW, imgH, offsetX, offsetY;
  if (cw / ch > imgAspect) {
    imgH = ch; imgW = ch * imgAspect; offsetX = (cw - imgW) / 2; offsetY = 0;
  } else {
    imgW = cw; imgH = cw / imgAspect; offsetX = 0; offsetY = (ch - imgH) / 2;
  }
  var clickX = e.clientX - imgRect.left - offsetX;
  var clickY = e.clientY - imgRect.top - offsetY;
  if (clickX < 0 || clickY < 0 || clickX > imgW || clickY > imgH) return null;
  return {
    x: Math.round((clickX / imgW) * wallPreviewScreenWidth),
    y: Math.round((clickY / imgH) * wallPreviewScreenHeight)
  };
}

function wallSendMouse(type, x, y, extra) {
  if (!wallPreviewDeviceId) return;
  var dev = devices[wallPreviewDeviceId];
  if (!dev || !dev.supportsKeyClient || !dev.online) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    var payload = { type: type, deviceId: wallPreviewDeviceId, x: x, y: y, previewWidth: wallPreviewScreenWidth, previewHeight: wallPreviewScreenHeight };
    if (extra) Object.assign(payload, extra);
    ws.send(JSON.stringify(payload));
  }
}

function wallHandlePreviewClick(e) {
  var pos = wallGetClickPos(e);
  if (pos) wallSendMouse('mouseClick', pos.x, pos.y);
}

// ── 多显示器切换 ────────────────────────────────────────────
function wallCycleMonitor() {
  if (!wallPreviewDeviceId) return;
  var dev = devices[wallPreviewDeviceId];
  if (!dev || dev.monitorCount <= 1) return;
  dev.monitorIndex = (dev.monitorIndex % dev.monitorCount) + 1;
  var monBtn = document.getElementById('wallPreviewMonitorBtn');
  if (monBtn) monBtn.textContent = '🖥️ 显示器 ' + dev.monitorIndex;
  // 通知服务端切换显示器
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'switchMonitor', deviceId: wallPreviewDeviceId, monitorIndex: dev.monitorIndex }));
  }
  // 更新标题
  document.getElementById('wallPreviewDeviceName').textContent = (dev.name || '未知') + ' - 实时预览 🖥️' + dev.monitorIndex;
}

var SHIFT_DISPLAY_MAP = {
  '`':'~', '1':'!', '2':'@', '3':'#', '4':'$', '5':'%', '6':'^', '7':'&', '8':'*', '9':'(', '0':')',
  '-':'_', '=':'+',
  '[':'{', ']':'}', '\\':'|',
  ';':':', "'":'"',
  ',':'<', '.':'>', '/':'?',
};

function wallToggleKeyboard() {
  if (wallKeyboardOpen) {
    wallCloseKeyboard();
  } else {
    wallOpenKeyboard();
  }
}

function wallOpenKeyboard() {
  if (!wallPreviewDeviceId) return;
  var dev = devices[wallPreviewDeviceId];
  if (!dev || !dev.supportsKeyClient) return;

  var container = document.getElementById('wallKeyboardContent');
  var overlay = document.getElementById('wallKeyboardOverlay');

  var html = '<div class="keyboard-layout">';
  html += '<div class="keyboard-section main-section">';

  function renderKey(key) {
    if (!key) return '<div class="kb-spacer"></div>';
    var w = key.w ? 'style="min-width:' + (key.w * 32) + 'px"' : '';
    var h = key.h ? 'style="height:' + (key.h * 32 + (key.h-1)*3) + 'px"' : '';
    var k = (key.key || key.label).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    var label = key.label.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return '<button class="kb-key" ' + w + h + ' data-orig-label="' + label + '" onclick="wallSendKey(\'' + k + '\')">' + label + '</button>';
  }

  function renderRow(keys, extraKeys) {
    var row = '<div class="kb-row">';
    keys.forEach(function(k) { row += renderKey(k); });
    if (extraKeys) extraKeys.forEach(function(k) { row += renderKey(k); });
    return row + '</div>';
  }

  html += renderRow(KEYBOARD_LAYOUT.main[0]);
  html += renderRow(KEYBOARD_LAYOUT.main[1], KEYBOARD_LAYOUT.edit[0]);
  html += renderRow(KEYBOARD_LAYOUT.main[2], KEYBOARD_LAYOUT.edit[1]);
  html += renderRow(KEYBOARD_LAYOUT.main[3]);

  // ZXCV行 + 方向键
  html += '<div class="kb-row"><div class="kb-keys" style="display:flex;gap:3px;">';
  KEYBOARD_LAYOUT.main[4].forEach(function(k) { html += renderKey(k); });
  html += renderKey(KEYBOARD_LAYOUT.arrows[0][0]);
  html += renderKey(KEYBOARD_LAYOUT.arrows[0][1]);
  html += '</div></div>';

  html += '<div class="kb-row"><div class="kb-keys" style="display:flex;gap:3px;">';
  KEYBOARD_LAYOUT.main[5].forEach(function(k) { html += renderKey(k); });
  KEYBOARD_LAYOUT.arrows[1].forEach(function(k) { html += renderKey(k); });
  html += '</div></div>';
  html += '</div>';

  // 数字小键盘区
  html += '<div class="numpad-section" style="padding-top: 35px;">';
  html += '<div class="numpad-grid">';
  function np(label, col, row, colspan, rowspan, key) {
    if (!label) return '';
    var keyCode = (key || label).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    var labelEsc = label.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var style = 'grid-column:' + col + ';grid-row:' + row + ';';
    if (colspan > 1) style = 'grid-column:' + col + ' / span ' + colspan + ';grid-row:' + row + ';';
    if (rowspan > 1) style = 'grid-column:' + col + ';grid-row:' + row + ' / span ' + rowspan + ';';
    if (colspan > 1 && rowspan > 1) style = 'grid-column:' + col + ' / span ' + colspan + ';grid-row:' + row + ' / span ' + rowspan + ';';
    return '<button class="kb-key" style="' + style + '" data-orig-label="' + labelEsc + '" onclick="wallSendKey(\'' + keyCode + '\')">' + labelEsc + '</button>';
  }
  html += np('Num', 1, 1) + np('/', 2, 1) + np('*', 3, 1) + np('-', 4, 1);
  html += np('7', 1, 2) + np('8', 2, 2) + np('9', 3, 2) + np('+', 4, 2, 1, 2);
  html += np('4', 1, 3) + np('5', 2, 3) + np('6', 3, 3);
  html += np('1', 1, 4) + np('2', 2, 4) + np('3', 3, 4) + np('Enter', 4, 4, 1, 2);
  html += np('0', 1, 5, 2) + np('.', 3, 5);
  html += '</div></div>';
  html += '</div>';

  container.innerHTML = html;
  overlay.style.display = 'flex';
  wallKeyboardOpen = true;
}

function wallCloseKeyboard() {
  var overlay = document.getElementById('wallKeyboardOverlay');
  overlay.style.display = 'none';
  wallKeyboardOpen = false;
}

function wallSendKey(key) {
  if (!wallPreviewDeviceId) return;
  var dev = devices[wallPreviewDeviceId];
  if (!dev || !dev.supportsKeyClient || !dev.online) return;

  var keyMap = {
    '↑': 'UP', '↓': 'DOWN', '←': 'LEFT', '→': 'RIGHT',
    'Space': 'SPACE', '←': 'BACKSPACE', 'Enter': 'RETURN',
    'Num': 'NUMLOCK', 'ScrLk': 'SCROLLLOCK', 'PrtSc': 'PRINT_SCREEN',
    'Caps': 'CAPS_LOCK', 'ESC': 'ESCAPE',
    'Ins': 'INSERT', 'Del': 'DELETE', 'Home': 'HOME', 'End': 'END',
    'PgUp': 'PAGE_UP', 'PgDn': 'PAGE_DOWN', 'Tab': 'TAB', 'Win': 'LWIN',
    'Pause': 'PAUSE', 'BS': 'BACKSPACE'
  };

  if (key === 'SHIFT') return;

  var actualKey = keyMap[key] || key;
  var sendKey = actualKey;

  if (physicalShiftDown) {
    if (SHIFT_DISPLAY_MAP[key]) {
      sendKey = SHIFT_DISPLAY_MAP[key];
    } else if (/^[a-z]$/.test(key)) {
      sendKey = 'Shift+' + key.toUpperCase();
    }
  }

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'keyClick', deviceId: wallPreviewDeviceId, key: sendKey }));
  }
}

// 物理 Shift 键
window.addEventListener('keydown', function(e) {
  if (e.key === 'Shift' && !physicalShiftDown) {
    if (wallPreviewDeviceId && devices[wallPreviewDeviceId] && devices[wallPreviewDeviceId].supportsKeyClient) {
      physicalShiftDown = true;
      document.querySelectorAll('.kb-key').forEach(function(btn) {
        var origLabel = btn.getAttribute('data-orig-label');
        if (origLabel && SHIFT_DISPLAY_MAP[origLabel]) {
          btn.textContent = SHIFT_DISPLAY_MAP[origLabel];
        }
      });
    }
  }
});

window.addEventListener('keyup', function(e) {
  if (e.key === 'Shift') {
    physicalShiftDown = false;
    document.querySelectorAll('.kb-key').forEach(function(btn) {
      var origLabel = btn.getAttribute('data-orig-label');
      if (origLabel) btn.textContent = origLabel;
    });
  }
});

// ESC 关闭预览
window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && wallPreviewDeviceId) {
    wallClosePreview();
  }
});

function handleWallStateUpdate(data) {
  var eventType = data.eventType;
  var serverDevices = data.devices || [];
  var serverGroups = data.groups || [];

  if (serverGroups.length > 0) {
    groups = serverGroups;
  }

  serverDevices.forEach(function(sd) {
    if (devices[sd.deviceId]) {
      devices[sd.deviceId].online = sd.online;
      devices[sd.deviceId].name = sd.deviceName;
      devices[sd.deviceId].groupId = sd.groupId;
      if (sd.groupId) {
        var groupObj = groups.find(function(g) { return g.id === sd.groupId; });
        devices[sd.deviceId].groupName = groupObj ? groupObj.name : '未分组';
      } else {
        devices[sd.deviceId].groupName = '未分组';
      }
    }
  });

  if (eventType === 'deviceOffline') {
    var deviceId = data.deviceId;
    var cell = findCellByDeviceId(deviceId);
    if (cell) {
      cell.classList.add('offline');
      cell.classList.remove('deleted');
      var badge = cell.querySelector('.offline-badge');
      if (badge) { badge.textContent = '设备已离线'; badge.style.display = 'block'; }
      updateUUButtonVisibility(cell, false);
      // 关闭1080p
      if (ws && ws.readyState === WebSocket.OPEN) {
        if (wallPreviewDeviceId === deviceId) {
          ws.send(JSON.stringify({ type: 'hq1080Off', deviceId: deviceId }));
        }
        ws.send(JSON.stringify({ type: 'stopHQ', deviceId: deviceId }));
      }
      // 离线显示静态图
      var img = document.getElementById('img_' + deviceId);
      if (img) {
        var dev = devices[deviceId];
        if (dev && dev.screenshot) {
          img.src = dev.screenshot;
        }
        img.style.display = 'block';
      }
    }
    // 如果正在预览该设备，更新预览状态
    if (wallPreviewDeviceId === deviceId) {
      var previewImg = document.getElementById('wallPreviewImg');
      var dev = devices[deviceId];
      if (previewImg && dev && dev.screenshot) {
        previewImg.src = dev.screenshot;
        previewImg.style.display = 'block';
        previewImg.style.visibility = 'visible';
        previewImg.style.filter = 'grayscale(100%)';
      }
      var watermark = document.getElementById('wallPreviewOfflineWatermark');
      if (watermark) watermark.style.display = 'block';
      // 禁用UU按钮
      var uuBtn = document.getElementById('wallPreviewUUbtn');
      if (uuBtn) { uuBtn.disabled = true; uuBtn.style.opacity = '0.35'; uuBtn.style.cursor = 'not-allowed'; uuBtn.style.pointerEvents = 'none'; }
    }
  }

  if (eventType === 'deviceOnline') {
    var deviceId = data.deviceId;
    var cell = findCellByDeviceId(deviceId);
    if (cell) {
      cell.classList.remove('offline');
      cell.classList.remove('deleted');
      frameHealCount.delete(deviceId);
      var badge = cell.querySelector('.offline-badge');
      if (badge) badge.style.display = 'none';
      updateUUButtonVisibility(cell, true);
      var uuBtn = cell.querySelector('.uu-float-btn');
      var dev = devices[deviceId];
      if (!uuBtn && dev && dev.uuDeviceId) {
        var newBtn = document.createElement('button');
        newBtn.className = 'uu-float-btn';
        newBtn.onclick = function() { openUU(dev.uuDeviceId); };
        newBtn.textContent = '🖱️ UU远程';
        cell.appendChild(newBtn);
      } else if (uuBtn) {
        uuBtn.classList.remove('hidden');
      }
      var img = document.getElementById('img_' + deviceId);
      if (img) {
        img.style.display = 'block';
      }
      // 重新开启HQ流
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'startHQ', deviceId: deviceId }));
        // 如果正在预览，也开启1080p
        if (wallPreviewDeviceId === deviceId) {
          ws.send(JSON.stringify({ type: 'hq1080On', deviceId: deviceId }));
          // 恢复预览UI
          var watermark = document.getElementById('wallPreviewOfflineWatermark');
          if (watermark) watermark.style.display = 'none';
          var previewImg = document.getElementById('wallPreviewImg');
          if (previewImg) previewImg.style.filter = '';
          // 恢复UU按钮
          var previewUUbtn = document.getElementById('wallPreviewUUbtn');
          if (previewUUbtn && dev && dev.uuDeviceId) {
            previewUUbtn.disabled = false;
            previewUUbtn.style.opacity = '';
            previewUUbtn.style.cursor = '';
            previewUUbtn.style.pointerEvents = '';
          }
        }
      }
    }
    if (data.deviceName) {
      var dev = devices[deviceId];
      if (dev) dev.name = data.deviceName;
      updateDeviceInfo(deviceId, data.deviceName, null);
    }
  }

  if (eventType === 'deviceRenamed') {
    var deviceId = data.deviceId;
    var deviceName = data.deviceName;
    if (devices[deviceId]) {
      devices[deviceId].name = deviceName;
    }
    updateDeviceInfo(deviceId, deviceName, null);
  }

  if (eventType === 'deviceDeleted') {
    var deviceId = data.deviceId;
    if (devices[deviceId]) {
      devices[deviceId].deleted = true;
    }
    for (var i = 0; i < wallData.devices.length; i++) {
      if (wallData.devices[i].id === deviceId) {
        wallData.devices[i].deleted = true;
        break;
      }
    }
    var cell = findCellByDeviceId(deviceId);
    if (cell) {
      cell.classList.remove('offline');
      cell.classList.add('deleted');
      var badge = cell.querySelector('.offline-badge');
      if (badge) badge.textContent = '设备已删除';
      updateUUButtonVisibility(cell, false);
    }
    updateDeviceInfo(deviceId, '设备已删除', '已删除');
  }

  if (eventType === 'gridChanged') {
    updateAllDevicePositions(serverDevices);
  }

  if (eventType === 'groupsChanged') {
    updateAllDeviceInfo(serverDevices);
  }
}

function findCellByDeviceId(deviceId) {
  var img = document.getElementById('img_' + deviceId);
  if (img) {
    var cell = img.closest('.wall-cell');
    if (cell) return cell;
  }
  return null;
}

function updateDeviceInfo(deviceId, name, detail) {
  var info = document.getElementById('info_' + deviceId);
  if (info) {
    var nameEl = info.querySelector('.name');
    var detailEl = info.querySelector('.detail');
    if (nameEl && name !== null) nameEl.textContent = name;
    if (detailEl && detail !== null && detail !== undefined) detailEl.textContent = detail;
  }
}

function updateAllDevicePositions(serverDevices) {
  for (var i = 0; i < wallData.devices.length; i++) {
    var dev = wallData.devices[i];
    if (dev.deleted) continue;
    var sd = serverDevices.find(function(d) { return d.deviceId === dev.id; });
    if (sd && sd.cellIndex !== undefined) {
      dev.position = sd.cellIndex + 1;
      updateDeviceInfo(dev.id, dev.name, (dev.groupName || '未分组') + ' / 格' + dev.position);
    }
  }
}

function updateAllDeviceInfo(serverDevices) {
  for (var deviceId in devices) {
    var dev = devices[deviceId];
    var cell = findCellByDeviceId(deviceId);

    if (dev.deleted) {
      if (cell) {
        cell.classList.remove('offline');
        cell.classList.add('deleted');
        var badge = cell.querySelector('.offline-badge');
        if (badge) badge.textContent = '设备已删除';
        updateUUButtonVisibility(cell, false);
      }
      continue;
    }

    var sd = serverDevices.find(function(d) { return d.deviceId === deviceId; });
    if (sd) {
      dev.online = sd.online;
      dev.name = sd.deviceName;
      dev.groupId = sd.groupId;

      if (sd.groupId) {
        var groupObj = groups.find(function(g) { return g.id === sd.groupId; });
        dev.groupName = groupObj ? groupObj.name : '未分组';
      } else {
        dev.groupName = '未分组';
      }

      updateDeviceInfo(deviceId, sd.deviceName, (dev.groupName || '未分组') + ' / 格' + dev.position);

      if (cell) {
        cell.classList.remove('deleted');
        if (sd.online) {
          cell.classList.remove('offline');
          var badge = cell.querySelector('.offline-badge');
          if (badge) badge.textContent = '设备已离线';
          var uuBtn = cell.querySelector('.uu-float-btn');
          if (!uuBtn && dev.uuDeviceId) {
            var newBtn = document.createElement('button');
            newBtn.className = 'uu-float-btn';
            newBtn.onclick = function() { openUU(dev.uuDeviceId); };
            newBtn.textContent = '🖱️ UU远程';
            cell.appendChild(newBtn);
          } else if (uuBtn) {
            uuBtn.classList.remove('hidden');
          }
        } else {
          cell.classList.add('offline');
          var badge = cell.querySelector('.offline-badge');
          if (badge) badge.textContent = '设备已离线';
          updateUUButtonVisibility(cell, false);
        }
      }
    }
  }
}

function updateUUButtonVisibility(cell, show) {
  var uuBtn = cell.querySelector('.uu-float-btn');
  if (uuBtn) {
    if (show) {
      uuBtn.classList.remove('hidden');
    } else {
      uuBtn.classList.add('hidden');
    }
  }
}

function formatDate(date) {
  var y = date.getFullYear();
  var m = String(date.getMonth() + 1).padStart(2, '0');
  var d = String(date.getDate()).padStart(2, '0');
  var h = String(date.getHours()).padStart(2, '0');
  var min = String(date.getMinutes()).padStart(2, '0');
  var s = String(date.getSeconds()).padStart(2, '0');
  return y + '-' + m + '-' + d + ' ' + h + ':' + min + ':' + s;
}

function isMobile() {
  return window.innerWidth <= 768;
}

// ── 全局拖拽状态 ──
var _activeDrag = null; // { cell, deviceId, img, sX, sY, initTranslateX, initTranslateY, isDragging }
var _zoomTimers = {}; // deviceId -> timerId

document.addEventListener('mousemove', function(e) {
  if (!_activeDrag) return;
  var dx = e.clientX - _activeDrag.sX;
  var dy = e.clientY - _activeDrag.sY;

  if (!_activeDrag.isDragging && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
    _activeDrag.isDragging = true;
    _activeDrag.cell.style.cursor = 'grabbing';
  }
  if (!_activeDrag.isDragging) return;

  var dev = devices[_activeDrag.deviceId];
  if (!dev || !dev.crop) return;

  dev.crop.translateX = _activeDrag.initTranslateX + dx / (dev.crop.scale * 1.5);
  dev.crop.translateY = _activeDrag.initTranslateY + dy / (dev.crop.scale * 1.5);
  _activeDrag.img.style.transform = 'scale(' + dev.crop.scale + ') translate(' + dev.crop.translateX + 'px, ' + dev.crop.translateY + 'px)';
});

document.addEventListener('mouseup', function(e) {
  if (!_activeDrag) return;
  if (_activeDrag.isDragging) {
    _activeDrag.cell._justDragged = true;
    setTimeout(function() { _activeDrag.cell._justDragged = false; }, 50);
  }
  _activeDrag.cell.style.cursor = '';
  _activeDrag = null;
});

function _hideZoom(deviceId) {
  var zoomEl = document.getElementById('zoom_' + deviceId);
  if (zoomEl) zoomEl.style.opacity = '0';
}

function _showZoom(deviceId, scale) {
  var zoomEl = document.getElementById('zoom_' + deviceId);
  if (!zoomEl) return;
  zoomEl.textContent = Math.round(scale * 100) + '%';
  zoomEl.style.opacity = scale === 1 ? '0' : '1';
  if (_zoomTimers[deviceId]) clearTimeout(_zoomTimers[deviceId]);
  if (scale !== 1) {
    _zoomTimers[deviceId] = setTimeout(function() { _hideZoom(deviceId); }, 2000);
  }
}

function makeWallCellDraggable(cell, deviceId) {
  var img = document.getElementById('img_' + deviceId);
  if (!img) return;

  // 滚轮放大/缩小
  cell.addEventListener('wheel', function(e) {
    e.preventDefault();
    var dev = devices[deviceId];
    if (!dev) return;
    var crop = dev.crop || { scale: 1, translateX: 0, translateY: 0 };
    var normalizedDelta = Math.abs(e.deltaY) > 1 ? e.deltaY / 120 : e.deltaY;
    var step = 0.05;
    var delta = normalizedDelta < 0 ? step : -step;
    var newScale = crop.scale + delta;

    if (newScale < 1) {
      if (crop.scale === 1 && (crop.translateX !== 0 || crop.translateY !== 0)) {
        crop.translateX = 0;
        crop.translateY = 0;
        dev.crop = crop;
        img.style.transform = '';
        img.style.transformOrigin = 'center center';
        _hideZoom(deviceId);
      }
      return;
    }
    if (newScale > 3) newScale = 3;
    if (Math.abs(newScale - crop.scale) < 0.001 && crop.scale === 1) return;

    var rect = cell.getBoundingClientRect();
    var mouseX = e.clientX - rect.left - rect.width / 2;
    var mouseY = e.clientY - rect.top - rect.height / 2;
    var scaleDiff = newScale - crop.scale;

    crop.scale = newScale;
    if (newScale === 1 && delta < 0) {
      crop.translateX = 0;
      crop.translateY = 0;
    } else if (newScale > 1) {
      crop.translateX = (crop.translateX || 0) - mouseX * scaleDiff / newScale;
      crop.translateY = (crop.translateY || 0) - mouseY * scaleDiff / newScale;
    }
    dev.crop = crop;

    cell.style.cursor = newScale > 1 ? 'grab' : '';

    img.style.transform = 'scale(' + crop.scale + ') translate(' + (crop.translateX || 0) + 'px, ' + (crop.translateY || 0) + 'px)';
    img.style.transformOrigin = 'center center';

    _showZoom(deviceId, crop.scale);
  }, { passive: false });

  // 拖拽开始
  cell.addEventListener('mousedown', function(e) {
    if (e.target.tagName === 'BUTTON') return;
    var dev = devices[deviceId];
    if (!dev || !dev.crop) return;
    _activeDrag = {
      cell: cell,
      deviceId: deviceId,
      img: img,
      sX: e.clientX,
      sY: e.clientY,
      initTranslateX: dev.crop.translateX || 0,
      initTranslateY: dev.crop.translateY || 0,
      isDragging: false
    };
    e.preventDefault();
  });
}

// 页面关闭时清理
window.addEventListener('beforeunload', function() {
  if (wallData && wallData.devices) {
    var beaconData = {
      type: 'wallClose',
      devices: wallData.devices.map(function(d) { return d.id; })
    };
    navigator.sendBeacon('/api/wall-close', new Blob([JSON.stringify(beaconData)], { type: 'application/json' }));
  }

  if (ws && ws.readyState === WebSocket.OPEN) {
    if (wallData && wallData.devices) {
      // 关闭所有1080p
      if (wallPreviewDeviceId) {
        ws.send(JSON.stringify({ type: 'hq1080Off', deviceId: wallPreviewDeviceId }));
        ws.send(JSON.stringify({ type: 'stopHQ', deviceId: wallPreviewDeviceId }));
        ws.send(JSON.stringify({ type: 'unsubscribePreview', deviceId: wallPreviewDeviceId }));
      }
      wallData.devices.forEach(function(dev) {
        ws.send(JSON.stringify({ type: 'hq1080Off', deviceId: dev.id }));
      });
      wallData.devices.forEach(function(dev) {
        ws.send(JSON.stringify({ type: 'stopHQ', deviceId: dev.id }));
      });
      ws.send(JSON.stringify({ type: 'unsubscribeWall', devices: wallData.devices.map(function(d) { return d.id; }), pageClosing: true }));
    }
  }
  watchdog.stop();
  // 清理所有 Blob URL
  for (var id in _wallBlobs) {
    if (_wallBlobs[id]) URL.revokeObjectURL(_wallBlobs[id]);
  }
  _wallBlobs = {};
  _wallBlobMds = {};
  for (var zid in _zoomTimers) {
    if (_zoomTimers[zid]) clearTimeout(_zoomTimers[zid]);
  }
  _zoomTimers = {};
  try {
    var stored = localStorage.getItem('walledDevices');
    if (stored && wallData && wallData.devices) {
      var arr = JSON.parse(stored);
      var deviceIds = wallData.devices.map(function(d) { return d.id; });
      arr = arr.filter(function(item) { return deviceIds.indexOf(item.deviceId) < 0; });
      localStorage.setItem('walledDevices', JSON.stringify(arr));
    }
  } catch(e) {}
});

// 初始化
initWall();

// 打开UU远程
function openUU(uuDeviceId) {
  if (!uuDeviceId) { alert('该设备未设置UU设备ID'); return; }
  var url = 'uuycmgr://' + uuDeviceId;

  try {
    var opened = window.open(url);
    if (opened && !opened.closed) return;
  } catch(e) {}

  try {
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = url;
    document.body.appendChild(iframe);
    setTimeout(function() { document.body.removeChild(iframe); }, 1000);
    return;
  } catch(e) {}

  try {
    var a = document.createElement('a');
    a.href = url;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() { document.body.removeChild(a); }, 1000);
    return;
  } catch(e) {}
}
