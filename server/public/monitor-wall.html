<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="屏幕墙监控墙，多设备同屏实时监控">
<meta name="robots" content="noindex, nofollow">
<title>监控墙</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.wall-container {
  width: 100%;
  height: 100%;
  display: grid;
  gap: 2px;
  padding: 2px;
}
.wall-cell {
  position: relative;
  background: #1a1d27;
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  cursor: grab;
}
.wall-cell.fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 9999;
}
/* 双层结构：外层 img-wrapper 用 cover 切掉多余，内层 img 用 contain 完整显示 */
.wall-cell .img-wrapper {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}
.wall-cell .img-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  margin: auto;
}
.wall-cell.empty {
  display: flex;
  align-items: center;
  justify-content: center;
}
.wall-cell.empty::after {
  content: "无信号";
  color: #4a4a4a;
  font-size: 14px;
}
/* 时间戳 - 左上 */
.wall-timestamp {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 14px;
  padding: 4px 10px;
  border-radius: 4px;
  font-family: "Consolas", monospace;
}
/* 标题信息 - 右下 */
.wall-info {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 4px;
  text-align: right;
}
.wall-info .name {
  font-weight: 600;
}
.wall-info .detail {
  font-size: 11px;
  opacity: 0.8;
}
/* 离线状态 */
.wall-cell.offline img {
  filter: grayscale(100%);
  opacity: 0.5;
}
/* 删除状态 - 优先级高于离线 */
.wall-cell.deleted img {
  filter: grayscale(100%) blur(2px);
  opacity: 0.3;
}
.wall-cell .offline-badge {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(80, 90, 110, 0.82);
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  display: none;
  z-index: 5;
}
.wall-cell.offline .offline-badge {
  display: block;
}
.wall-cell.deleted .offline-badge {
  display: flex !important;
  background: rgba(180, 50, 50, 0.9) !important;
}
/* 浮动UU远程按钮 */
.uu-float-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(79, 126, 247, 0.92);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 5px;
  box-shadow: 0 4px 16px rgba(79, 126, 247, 0.4);
  transition: all 0.2s;
  z-index: 6;
  white-space: nowrap;
}
.uu-float-btn:hover {
  background: rgba(60, 100, 230, 1);
  transform: translate(-50%, -50%) scale(1.05);
  box-shadow: 0 6px 20px rgba(79, 126, 247, 0.5);
}
.wall-cell:hover .uu-float-btn {
  display: flex;
}
.uu-float-btn.hidden {
  display: none !important;
}

/* 缩放比例显示 */
.wall-zoom-level {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  z-index: 10;
  transition: opacity 0.3s;
  pointer-events: none;
}

/* ── 全屏隐藏 ─────────────────────────── */
.wall-cell.hidden {
  display: none;
}

/* ── 性能统计面板 ─────────────────────────── */
.stats-panel {
  position: fixed;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.8);
  color: #0f0;
  font-family: "Consolas", monospace;
  font-size: 11px;
  padding: 6px 10px;
  border-radius: 4px;
  z-index: 100;
  pointer-events: none;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="wall-container" id="wallContainer"></div>
<div class="stats-panel" id="statsPanel"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// 性能优化模块
// ═══════════════════════════════════════════════════════════════

// ── 1. Blob URL 缓存（与格子页面一致的简化模式）────────
// 每设备 1 个 blob URL，新帧到达时立即 revoke 旧 URL
const _wallBlobCache = new Map();  // deviceId -> url
const _pendingWallRevokes = new Map();  // url -> timeoutId（追踪待 revoke 的 timeout）
function wallBlobSet(deviceId, base64Data) {
  if (!base64Data) return null;
  const old = _wallBlobCache.get(deviceId);
  const match = base64Data.match(/^data:([^;]+);base64,(.+)$/);
  if (!match) return null;
  const mimeType = match[1];
  const data = atob(match[2]);
  const len = data.length;
  const buf = new Uint8Array(len);
  for (let i = 0; i < len; i++) buf[i] = data.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([buf], { type: mimeType }));
  _wallBlobCache.set(deviceId, url);
  // 新帧到达时立即 revoke 旧 URL（不再等 500ms）
  if (old) {
    URL.revokeObjectURL(old);
    _pendingWallRevokes.delete(old);
  }
  return url;
}
function wallBlobRevokeAll() {
  // 关闭时立即 revoke 所有 blob，并清除待处理的 timeout
  for (const url of _wallBlobCache.values()) {
    URL.revokeObjectURL(url);
    const tid = _pendingWallRevokes.get(url);
    if (tid) { clearTimeout(tid); _pendingWallRevokes.delete(url); }
  }
  _wallBlobCache.clear();
}

// ═══════════════════════════════════════════════════════════════
const watchdog = (function() {
  let _interval = null;
  let _lastUpdate = {};
  const TIMEOUT_MS = 3000;

  function start() {
    if (_interval) clearInterval(_interval);
    _interval = setInterval(check, 2000);
  }

  function touch(deviceId) {
    _lastUpdate[deviceId] = Date.now();
  }

  function check() {
    const now = Date.now();
    for (const deviceId in _lastUpdate) {
      if (now - _lastUpdate[deviceId] > TIMEOUT_MS) {
        const img = document.getElementById('img_' + deviceId);
        if (img && img.src) {
          // 强制刷新
          const currentSrc = img.src;
          img.src = '';
          img.src = currentSrc;
        }
      }
    }
  }

  function stop() {
    if (_interval) { clearInterval(_interval); _interval = null; }
    _lastUpdate = {};
  }

  return { start, touch, stop };
})();

// ── 辅助函数：为指定设备启动 MJPEG 流 ────────────────────────
function startWallMjpeg(deviceId) {
  var img = document.getElementById('img_' + deviceId);
  if (!img) return;
  var expectedSrc = '/mjpeg/' + deviceId;
  if (img.src && img.src.includes(expectedSrc)) return;
  img.style.width = '100%';
  img.style.height = '100%';
  img.src = expectedSrc;
  img.style.display = 'block';
}

// ═══════════════════════════════════════════════════════════════
// 主程序
// ═══════════════════════════════════════════════════════════════

// 获取配置数据
var wallData = null;
var devices = {}; // deviceId -> { id, name, groupName, position, online, crop, groupId }
var groups = [];  // 分组列表
try {
  var stored = sessionStorage.getItem('monitorWallData');
  if (stored) {
    wallData = JSON.parse(stored);
    sessionStorage.removeItem('monitorWallData'); // 清理
    // 初始化设备状态
    wallData.devices.forEach(function(d) {
      devices[d.id] = {
        id: d.id,
        uuDeviceId: d.uuDeviceId || null,
        name: d.name,
        groupName: d.groupName || '未分组',
        position: d.position,
        online: d.online !== undefined ? d.online : true,
        crop: d.crop,
        groupId: null
      };
    });
  }
} catch(e) {}

if (!wallData) {
  document.body.innerHTML = '<div class="error-center">未找到配置数据，请从主页面重新操作</div>';
}

// WebSocket 连接
var ws = null;
var subscribedDevices = []; // 订阅的设备列表

// ── 全屏状态 ────────────────────────────────────────────────
var wallFullscreenDeviceId = null; // 当前全屏的设备ID
var wallFullscreenReset = false; // 是否已点击过重置
var wallOriginalLayout = null; // 原始布局数字
var wallOriginalDeviceCount = 0; // 原始设备数量
var wallOriginalCrop = null; // 原始crop值（缩放和位置）

// 切换格子全屏/还原
function toggleWallCellFullscreen(cell, deviceId) {
  var container = document.getElementById('wallContainer');

  if (wallFullscreenDeviceId === deviceId) {
    // 全屏时判断是否需要跳过"第1次点击"
    var dev = devices[deviceId];
    var isDefaultState = dev && dev.crop && dev.crop.scale === 1 && dev.crop.translateX === 0 && dev.crop.translateY === 0;

    if (wallFullscreenReset || isDefaultState) {
      // 已点击过重置 或 已经是默认状态：恢复原始布局
      restoreWallLayout();
    } else {
      // 第1次点击：缩放1倍 + 重置位置，保持全屏
      wallFullscreenReset = true;
      var img = document.getElementById('img_' + deviceId);
      if (img && dev) {
        dev.crop.scale = 1;
        dev.crop.translateX = 0;
        dev.crop.translateY = 0;
        img.style.transform = 'scale(1) translate(0px, 0px)';
      }
      // 重置缩放显示
      var zoomEl = document.getElementById('zoom_' + deviceId);
      if (zoomEl) zoomEl.textContent = '100%';
    }
  } else {
    // 切换到全屏
    enterWallFullscreen(cell, deviceId);
  }
}

function enterWallFullscreen(cell, deviceId) {
  var container = document.getElementById('wallContainer');

  // 保存原始状态（只在首次进入时保存）
  if (wallFullscreenDeviceId === null) {
    wallOriginalLayout = wallData.layout;
    wallOriginalDeviceCount = wallData.devices.length;
    // 保存原始crop（缩放和位置）
    var devForCrop = devices[deviceId];
    if (devForCrop && devForCrop.crop) {
      wallOriginalCrop = { ...devForCrop.crop };
    }
  }

  wallFullscreenDeviceId = deviceId;

  // ① 记录变换前的格子尺寸（layout 尺寸，不受 CSS transform 影响）
  var cellW = cell.offsetWidth;
  var cellH = cell.offsetHeight;
  var dev = devices[deviceId];
  var oldTx = (dev && dev.crop) ? (dev.crop.translateX || 0) : 0;
  var oldTy = (dev && dev.crop) ? (dev.crop.translateY || 0) : 0;
  var scale  = (dev && dev.crop) ? (dev.crop.scale  || 1) : 1;

  // 切换到1格布局，填满整个视口
  wallData.layout = 1;
  container.style.gridTemplateColumns = '1fr';
  container.style.gridTemplateRows = '1fr';
  container.style.gap = '0';
  container.style.padding = '0';

  // 隐藏所有格子，只显示目标格子
  for (var i = 0; i < wallOriginalDeviceCount; i++) {
    var c = document.getElementById('cell_' + i);
    if (c) c.classList.add('hidden');
  }
  cell.classList.remove('hidden');
  cell.classList.add('fullscreen');

  // ② 读取全屏后格子尺寸（offsetWidth 会强制触发重排，拿到最新值）
  var fullW = cell.offsetWidth;
  var fullH = cell.offsetHeight;

  // ③ 等比例换算 translate：保持格子中心对应图片上同一个锚点
  //   小格下中心锚点（img 坐标，以 img 中心为原点）= (-oldTx, -oldTy)
  //   img 元素从 cellW×cellH 缩放到 fullW×fullH，锚点坐标等比例放大
  //   新 translate = oldT * (fullSize / cellSize)
  var newTx = (cellW > 0) ? oldTx * fullW / cellW : 0;
  var newTy = (cellH > 0) ? oldTy * fullH / cellH : 0;

  if (dev && dev.crop) {
    dev.crop.translateX = newTx;
    dev.crop.translateY = newTy;
    var img = document.getElementById('img_' + deviceId);
    if (img) {
      img.style.transform = 'scale(' + scale + ') translate(' + newTx + 'px, ' + newTy + 'px)';
      img.style.transformOrigin = 'center center';
    }
  }

  // 开启1080p
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'hq1080On', deviceId: deviceId }));
  }
}

function restoreWallLayout() {
  var container = document.getElementById('wallContainer');

  if (wallFullscreenDeviceId === null) return;

  // 恢复原始布局
  wallData.layout = wallOriginalLayout;
  var cfg = compactLayouts[wallOriginalLayout];
  var rows = cfg ? cfg.rows : Math.sqrt(wallOriginalLayout);
  var cols = cfg ? cfg.cols : Math.sqrt(wallOriginalLayout);
  container.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  container.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
  container.style.gap = '2px';
  container.style.padding = '2px';

  // 显示所有格子并移除fullscreen类
  for (var i = 0; i < wallOriginalDeviceCount; i++) {
    var c = document.getElementById('cell_' + i);
    if (c) {
      c.classList.remove('hidden');
      c.classList.remove('fullscreen');
    }
  }

  // 恢复原始缩放和位置
  if (wallFullscreenDeviceId && wallOriginalCrop) {
    var devForRestore = devices[wallFullscreenDeviceId];
    if (devForRestore) {
      devForRestore.crop.scale = wallOriginalCrop.scale;
      devForRestore.crop.translateX = wallOriginalCrop.translateX;
      devForRestore.crop.translateY = wallOriginalCrop.translateY;
      var imgForRestore = document.getElementById('img_' + wallFullscreenDeviceId);
      if (imgForRestore) {
        imgForRestore.style.transform = 'scale(' + devForRestore.crop.scale + ') translate(' + devForRestore.crop.translateX + 'px, ' + devForRestore.crop.translateY + 'px)';
      }
      // 更新缩放显示
      var zoomElForRestore = document.getElementById('zoom_' + wallFullscreenDeviceId);
      if (zoomElForRestore) {
        zoomElForRestore.textContent = Math.round(devForRestore.crop.scale * 100) + '%';
        zoomElForRestore.style.opacity = devForRestore.crop.scale === 1 ? '0' : '1';
      }
    }
  }

  // 关闭1080p
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'hq1080Off', deviceId: wallFullscreenDeviceId }));
  }

  // 清除状态
  wallFullscreenDeviceId = null;
  wallFullscreenReset = false;
  wallOriginalLayout = null;
  wallOriginalDeviceCount = 0;
  wallOriginalCrop = null;
}

// ── 性能统计 ────────────────────────────────────────────────
var stats = {
  framesReceived: 0,
  framesRendered: 0,
  wsReconnects: 0,
  lastReport: performance.now()
};

// ── 自愈帧计数 ──────────────────────────────────────────────
var frameHealCount = new Map(); // deviceId -> count
var WALL_FRAME_HEAL_THRESHOLD = 2; // 至少收到2帧才恢复离线格子

function updateStats() {
  if (!wallData.debug) return;
  const now = performance.now();
  const elapsed = (now - stats.lastReport) / 1000;
  const fps = elapsed > 0 ? Math.round(stats.framesReceived / elapsed) : 0;
  document.getElementById('statsPanel').innerHTML =
    'FPS: ' + fps + '<br>' +
    'Recv: ' + stats.framesReceived + '<br>' +
    'Render: ' + stats.framesRendered + '<br>' +
    'BlobCache: ' + _wallBlobCache.size + '<br>' +
    'Reconnects: ' + stats.wsReconnects;
  stats.framesReceived = 0;
  stats.lastReport = now;
}

// 紧凑布局行列配置（完全平方数用 NxN，非完全平方数自定义行列）
var compactLayouts = {
  6: { rows: 2, cols: 3 },   // 3x2
  12: { rows: 3, cols: 4 },  // 4x3
  20: { rows: 4, cols: 5 }   // 5x4
};

function initWall() {
  var container = document.getElementById('wallContainer');
  var cfg = compactLayouts[wallData.layout];
  var rows = cfg ? cfg.rows : Math.sqrt(wallData.layout);
  var cols = cfg ? cfg.cols : Math.sqrt(wallData.layout);
  container.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  container.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';

  // 保存订阅的设备列表
  subscribedDevices = wallData.devices.map(function(d) { return d.id; });

  // 创建格子
  for (var i = 0; i < wallData.layout; i++) {
    var cell = document.createElement('div');
    cell.className = 'wall-cell';
    cell.id = 'cell_' + i;

    if (i < wallData.devices.length) {
      var dev = wallData.devices[i];
      var uuBtnHTML = (dev.online !== false && dev.uuDeviceId) ? '<button class="uu-float-btn" onclick="openUU(\'' + dev.uuDeviceId + '\')">🖱️ UU远程</button>' : '';
      cell.innerHTML =
        '<div class="img-wrapper"><img id="img_' + dev.id + '" alt="监控画面: ' + dev.name + '" src="" class="wall-img-hidden" onerror="this.dataset.errored='true'"></div>' +
        '<div class="wall-zoom-level" id="zoom_' + dev.id + '">100%</div>' +
        '<div class="wall-timestamp" id="ts_' + dev.id + '">等待画面</div>' +
        '<div class="wall-info" id="info_' + dev.id + '">' +
          '<div class="name">' + dev.name + '</div>' +
          '<div class="detail">' + (dev.groupName || '未分组') + ' / 格' + dev.position + '</div>' +
        '</div>' +
        '<div class="offline-badge">设备已离线</div>' +
        uuBtnHTML;

      if (dev.online === false) {
        cell.classList.add('offline');
      }

      // 保存设备ID用于点击切换
      cell.deviceId = dev.id;
      cell.addEventListener('click', function(e) {
        // 避免点击UU按钮时触发全屏切换
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
        // 拖拽后不触发点击事件
        if (this._justDragged) {
          this._justDragged = false;
          return;
        }
        toggleWallCellFullscreen(this, this.deviceId);
      });
    } else {
      cell.classList.add('empty');
    }

    container.appendChild(cell);
  }

  // 为所有格子添加滚轮放大和拖拽功能
  for (var i = 0; i < wallData.layout; i++) {
    var cell = document.getElementById('cell_' + i);
    if (!cell) continue;
    var devId = wallData.devices[i] ? wallData.devices[i].id : null;
    if (devId) {
      makeWallCellDraggable(cell, devId);
    }
  }

  // 开启统计面板（调试用）
  if (wallData.debug) {
    document.getElementById('statsPanel').style.display = 'block';
    setInterval(updateStats, 2000);
  }

  // 连接 WebSocket
  connectWebSocket();

  // 启动看门狗
  watchdog.start();

  // 页面关闭时清理
  window.addEventListener('beforeunload', function() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'unsubscribeWall', devices: subscribedDevices }));
    }
    wallBlobRevokeAll();
    watchdog.stop();
    try {
      var stored = localStorage.getItem('walledDevices');
      if (stored) {
        var arr = JSON.parse(stored);
        var deviceIds = wallData.devices.map(function(d) { return d.id; });
        arr = arr.filter(function(item) { return deviceIds.indexOf(item.deviceId) < 0; });
        localStorage.setItem('walledDevices', JSON.stringify(arr));
      }
    } catch(e) {}
  });
}

function connectWebSocket() {
  var wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/browser';
  ws = new WebSocket(wsUrl);

  ws.onopen = function() {
    // 连接成功，请求高清截图（3fps）
    ws.send(JSON.stringify({
      type: 'subscribeWall',
      devices: wallData.devices.map(function(d) { return d.id; }),
      interval: 333
    }));
    // 立即启动所有在线设备的 MJPEG 流（wallScreenshot 消息处理有兜底，不会重复设置）
    wallData.devices.forEach(function(dev) {
      if (dev.online !== false) {
        startWallMjpeg(dev.id);
      }
    });
  };

  ws.onclose = function() {
    stats.wsReconnects++;
    // 重连
    setTimeout(connectWebSocket, 3000);
  };

  ws.onerror = function(err) {
    // console.error('WebSocket error:', err);
  };

  ws.onmessage = function(e) {
    try {
      var data = JSON.parse(e.data);

      if (data.type === 'wallScreenshot') {
        stats.framesReceived++;
        var deviceId = data.deviceId;
        var screenshot = data.screenshot;
        var timestamp = data.timestamp || Date.now();

        // 保存当前帧（用于离线帧缓存）
        var dev = devices[deviceId];
        if (dev) {
          dev.lastFrame = screenshot;
        }

        // 自愈：累加帧计数，只有连续收到多帧才恢复在线状态
        var cell = findCellByDeviceId(deviceId);
        if (cell && cell.classList.contains('offline')) {
          if (!frameHealCount.has(deviceId)) frameHealCount.set(deviceId, 0);
          frameHealCount.set(deviceId, frameHealCount.get(deviceId) + 1);
          if (frameHealCount.get(deviceId) >= WALL_FRAME_HEAL_THRESHOLD) {
            cell.classList.remove('offline');
            cell.classList.remove('deleted');
            var badge = cell.querySelector('.offline-badge');
            if (badge) badge.style.display = 'none';
            updateUUButtonVisibility(cell, true);
          }
        } else if (cell) {
          // 非离线格子，重置帧计数（下次离线会重新累加）
          frameHealCount.delete(deviceId);
        }

        // ── MJPEG 流：只在首次或未正确设置时启动 ─────────────────
        var img = document.getElementById('img_' + deviceId);
        if (img) {
          var expectedSrc = '/mjpeg/' + deviceId;
          var needsStart = (!img.src || !img.src.includes(expectedSrc));
          // 流出错了，重试
          if (img.dataset.errored === 'true') { img.dataset.errored = 'false'; needsStart = true; }
          if (needsStart) {
            img.style.width = '100%';
            img.style.height = '100%';
            img.src = expectedSrc;
            img.style.display = 'block';
          }
          var dev = devices[deviceId];
          if (dev) {
            img.style.transform = 'scale(' + dev.crop.scale + ') translate(' + (dev.crop.translateX || 0) + 'px, ' + (dev.crop.translateY || 0) + 'px)';
            img.style.transformOrigin = 'center center';
          }
        }

        // ── 更新时间戳 ───────────────────────────────────
        var ts = document.getElementById('ts_' + deviceId);
        if (ts) {
          var d = new Date(timestamp);
          ts.textContent = formatDate(d);
        }

        // ── 更新看门狗 ─────────────────────────────────
        watchdog.touch(deviceId);
        stats.framesRendered++;
      }

      if (data.type === 'wallStateUpdate') {
        handleWallStateUpdate(data);
      }

      if (data.type === 'walledDevices') {
        // console.log('[Wall] Subscribed devices:', data.devices);
      }
    } catch(err) {
      // console.error('Parse error:', err);
    }
  };
}

// 处理状态变化
function handleWallStateUpdate(data) {
  var eventType = data.eventType;
  var serverDevices = data.devices || [];
  var serverGroups = data.groups || [];

  if (serverGroups.length > 0) {
    groups = serverGroups;
  }

  serverDevices.forEach(function(sd) {
    if (devices[sd.deviceId]) {
      devices[sd.deviceId].online = sd.online;
      devices[sd.deviceId].name = sd.deviceName;
      devices[sd.deviceId].groupId = sd.groupId;
      if (sd.groupId) {
        var groupObj = groups.find(function(g) { return g.id === sd.groupId; });
        devices[sd.deviceId].groupName = groupObj ? groupObj.name : '未分组';
      } else {
        devices[sd.deviceId].groupName = '未分组';
      }
    }
  });

  if (eventType === 'deviceOffline') {
    var deviceId = data.deviceId;
    var cell = findCellByDeviceId(deviceId);
    if (cell) {
      cell.classList.add('offline');
      cell.classList.remove('deleted');
      var badge = cell.querySelector('.offline-badge');
      if (badge) { badge.textContent = '设备已离线'; badge.style.display = 'block'; }
      updateUUButtonVisibility(cell, false);
    }
    // 保存离线帧（离线瞬间的最后一帧）
    var dev = devices[deviceId];
    if (dev && dev.lastFrame) {
      dev._offlineScreenshot = dev.lastFrame;
    }
    // 停止 MJPEG 流，显示离线帧
    var img = document.getElementById('img_' + deviceId);
    if (img) {
      img.src = ''; // 停止 MJPEG 流
      if (dev && dev._offlineScreenshot) {
        var blobUrl = wallBlobSet(deviceId, dev._offlineScreenshot);
        if (blobUrl) {
          img.src = blobUrl;
          img.style.display = 'block';
        }
      }
    }
    // 注意：不清空 _wallBlobCache，保留最后一张截图
    // 新帧到达时会自动更新，revoke 会导致离线期间白屏
  }

  if (eventType === 'deviceOnline') {
    var deviceId = data.deviceId;
    var cell = findCellByDeviceId(deviceId);
    if (cell) {
      cell.classList.remove('offline');
      cell.classList.remove('deleted');
      frameHealCount.delete(deviceId); // 设备上线，清除帧计数
      var badge = cell.querySelector('.offline-badge');
      if (badge) badge.style.display = 'none';
      updateUUButtonVisibility(cell, true);
      var uuBtn = cell.querySelector('.uu-float-btn');
      var dev = devices[deviceId];
      if (!uuBtn && dev && dev.uuDeviceId) {
        var newBtn = document.createElement('button');
        newBtn.className = 'uu-float-btn';
        newBtn.onclick = function() { openUU(dev.uuDeviceId); };
        newBtn.textContent = '🖱️ UU远程';
        cell.appendChild(newBtn);
      } else if (uuBtn) {
        uuBtn.classList.remove('hidden');
      }
    }
    // 清除离线帧缓存，上线后使用实时流
    var devOnline = devices[deviceId];
    if (devOnline) {
      devOnline._offlineScreenshot = null;
    }
    // 设备上线时主动启动 MJPEG 流
    startWallMjpeg(deviceId);
    if (data.deviceName) {
      var devName = devices[deviceId];
      if (devName) devName.name = data.deviceName;
      updateDeviceInfo(deviceId, data.deviceName, null);
    }
  }

  if (eventType === 'deviceRenamed') {
    var deviceId = data.deviceId;
    var deviceName = data.deviceName;
    if (devices[deviceId]) {
      devices[deviceId].name = deviceName;
    }
    updateDeviceInfo(deviceId, deviceName, null);
  }

  if (eventType === 'deviceDeleted') {
    var deviceId = data.deviceId;
    if (devices[deviceId]) {
      devices[deviceId].deleted = true;
    }
    for (var i = 0; i < wallData.devices.length; i++) {
      if (wallData.devices[i].id === deviceId) {
        wallData.devices[i].deleted = true;
        break;
      }
    }
    var cell = findCellByDeviceId(deviceId);
    if (cell) {
      cell.classList.remove('offline');
      cell.classList.add('deleted');
      var badge = cell.querySelector('.offline-badge');
      if (badge) badge.textContent = '设备已删除';
      updateUUButtonVisibility(cell, false);
    }
    // 清理设备 blob 缓存（立即 revoke）
    var old = _wallBlobCache.get(deviceId);
    _wallBlobCache.delete(deviceId);
    if (old) {
      URL.revokeObjectURL(old);
      _pendingWallRevokes.delete(old);
    }
    updateDeviceInfo(deviceId, '设备已删除', '已删除');
  }

  if (eventType === 'gridChanged') {
    updateAllDevicePositions(serverDevices);
  }

  if (eventType === 'groupsChanged') {
    updateAllDeviceInfo(serverDevices);
  }
}

function findCellByDeviceId(deviceId) {
  var img = document.getElementById('img_' + deviceId);
  if (img) {
    var cell = img.closest('.wall-cell');
    if (cell) return cell;
  }
  return null;
}

function updateDeviceInfo(deviceId, name, detail) {
  var info = document.getElementById('info_' + deviceId);
  if (info) {
    var nameEl = info.querySelector('.name');
    var detailEl = info.querySelector('.detail');
    if (nameEl && name !== null) nameEl.textContent = name;
    if (detailEl && detail !== null && detail !== undefined) detailEl.textContent = detail;
  }
}

function updateAllDevicePositions(serverDevices) {
  for (var i = 0; i < wallData.devices.length; i++) {
    var dev = wallData.devices[i];
    if (dev.deleted) continue;
    var sd = serverDevices.find(function(d) { return d.deviceId === dev.id; });
    if (sd && sd.cellIndex !== undefined) {
      dev.position = sd.cellIndex + 1;
      updateDeviceInfo(dev.id, dev.name, (dev.groupName || '未分组') + ' / 格' + dev.position);
    }
  }
}

function updateAllDeviceInfo(serverDevices) {
  for (var deviceId in devices) {
    var dev = devices[deviceId];
    var cell = findCellByDeviceId(deviceId);

    if (dev.deleted) {
      if (cell) {
        cell.classList.remove('offline');
        cell.classList.add('deleted');
        var badge = cell.querySelector('.offline-badge');
        if (badge) badge.textContent = '设备已删除';
        updateUUButtonVisibility(cell, false);
      }
      continue;
    }

    var sd = serverDevices.find(function(d) { return d.deviceId === deviceId; });
    if (sd) {
      dev.online = sd.online;
      dev.name = sd.deviceName;
      dev.groupId = sd.groupId;

      if (sd.groupId) {
        var groupObj = groups.find(function(g) { return g.id === sd.groupId; });
        dev.groupName = groupObj ? groupObj.name : '未分组';
      } else {
        dev.groupName = '未分组';
      }

      updateDeviceInfo(deviceId, sd.deviceName, (dev.groupName || '未分组') + ' / 格' + dev.position);

      if (cell) {
        cell.classList.remove('deleted');
        if (sd.online) {
          cell.classList.remove('offline');
          var badge = cell.querySelector('.offline-badge');
          if (badge) badge.textContent = '设备已离线';
          var uuBtn = cell.querySelector('.uu-float-btn');
          if (!uuBtn && dev.uuDeviceId) {
            var newBtn = document.createElement('button');
            newBtn.className = 'uu-float-btn';
            newBtn.onclick = function() { openUU(dev.uuDeviceId); };
            newBtn.textContent = '🖱️ UU远程';
            cell.appendChild(newBtn);
          } else if (uuBtn) {
            uuBtn.classList.remove('hidden');
          }
        } else {
          cell.classList.add('offline');
          var badge = cell.querySelector('.offline-badge');
          if (badge) badge.textContent = '设备已离线';
          updateUUButtonVisibility(cell, false);
        }
      }
    }
  }
}

function updateUUButtonVisibility(cell, show) {
  var uuBtn = cell.querySelector('.uu-float-btn');
  if (uuBtn) {
    if (show) {
      uuBtn.classList.remove('hidden');
    } else {
      uuBtn.classList.add('hidden');
    }
  }
}

function formatDate(date) {
  var y = date.getFullYear();
  var m = String(date.getMonth() + 1).padStart(2, '0');
  var d = String(date.getDate()).padStart(2, '0');
  var h = String(date.getHours()).padStart(2, '0');
  var min = String(date.getMinutes()).padStart(2, '0');
  var s = String(date.getSeconds()).padStart(2, '0');
  return y + '-' + m + '-' + d + ' ' + h + ':' + min + ':' + s;
}

// ─────────────────────────────────────────
// 滚轮放大 + 拖拽功能（与main.html预览一致）
// ─────────────────────────────────────────
var _wallDragState = {}; // deviceId -> { isDragging, startX, startY, initTranslateX, initTranslateY }

function makeWallCellDraggable(cell, deviceId) {
  var img = document.getElementById('img_' + deviceId);
  if (!img) return;

  var _sX, _sY;
  var _initTranslateX = 0, _initTranslateY = 0;
  var _isDragging = false;
  var _zoomTimer = null;

  function hideZoom() {
    var zoomEl = document.getElementById('zoom_' + deviceId);
    if (zoomEl) zoomEl.style.opacity = '0';
  }

  function showZoom(scale) {
    var zoomEl = document.getElementById('zoom_' + deviceId);
    if (!zoomEl) return;
    zoomEl.textContent = Math.round(scale * 100) + '%';
    zoomEl.style.opacity = scale === 1 ? '0' : '1';
    if (_zoomTimer) clearTimeout(_zoomTimer);
    if (scale !== 1) {
      _zoomTimer = setTimeout(hideZoom, 2000);
    }
  }

  // 滚轮放大/缩小
  cell.addEventListener('wheel', function(e) {
    e.preventDefault();
    var dev = devices[deviceId];
    if (!dev) return;
    var crop = dev.crop || { scale: 1, translateX: 0, translateY: 0 };
    // 归一化 deltaY
    var normalizedDelta = Math.abs(e.deltaY) > 1 ? e.deltaY / 120 : e.deltaY;
    // 方向判断：deltaY < 0 向上滚动（放大），> 0 向下滚动（缩小）
    var step = 0.05;
    var delta = normalizedDelta < 0 ? step : -step;
    var newScale = crop.scale + delta;
    
    // 弹性边界
    if (newScale < 1) {
      // scale=1时下滚：有偏移则重置居中，倍数不变
      if (crop.scale === 1 && (crop.translateX !== 0 || crop.translateY !== 0)) {
        crop.translateX = 0;
        crop.translateY = 0;
        dev.crop = crop;
        img.style.transform = '';
        img.style.transformOrigin = 'center center';
        hideZoom();
      }
      return;
    }
    if (newScale > 3) newScale = 3;
    if (Math.abs(newScale - crop.scale) < 0.001 && crop.scale === 1) {
      // scale=1时无偏移，直接忽略小变化
      return;
    }

    // 以鼠标位置为中心缩放（计算偏移）
    var rect = cell.getBoundingClientRect();
    var mouseX = e.clientX - rect.left - rect.width / 2;
    var mouseY = e.clientY - rect.top - rect.height / 2;
    var scaleDiff = newScale - crop.scale;

    crop.scale = newScale;
    // scale=1 时只在下滚（缩小）时重置居中，拖拽不触发
    if (newScale === 1 && delta < 0) {
      crop.translateX = 0;
      crop.translateY = 0;
    } else if (newScale > 1) {
      crop.translateX = (crop.translateX || 0) - mouseX * scaleDiff / newScale;
      crop.translateY = (crop.translateY || 0) - mouseY * scaleDiff / newScale;
    }
    dev.crop = crop;

    // scale > 1 显示 grab 光标
    if (newScale > 1) {
      cell.style.cursor = 'grab';
    } else {
      cell.style.cursor = '';
    }

    // 应用 transform（全程用 contain，双层结构：外层cover切边，内层contain放大）
    img.style.transform = 'scale(' + crop.scale + ') translate(' + (crop.translateX || 0) + 'px, ' + (crop.translateY || 0) + 'px)';
    img.style.transformOrigin = 'center center';

    // 更新缩放比例显示
    showZoom(crop.scale);
  }, { passive: false });

  // 拖拽开始
  cell.addEventListener('mousedown', function(e) {
    if (e.target.tagName === 'BUTTON') return;
    var dev = devices[deviceId];
    if (!dev || !dev.crop) return;
    _sX = e.clientX;
    _sY = e.clientY;
    _initTranslateX = dev.crop.translateX || 0;
    _initTranslateY = dev.crop.translateY || 0;
    _isDragging = false;
    e.preventDefault();
  });

  // 拖拽移动
  document.addEventListener('mousemove', function(e) {
    if (_sX === undefined) return;
    var dx = e.clientX - _sX;
    var dy = e.clientY - _sY;

    // 开始拖拽
    if (!_isDragging && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
      _isDragging = true;
      cell.style.cursor = 'grabbing';
    }
    if (!_isDragging) return;

    var dev = devices[deviceId];
    if (!dev || !dev.crop) return;

    // 按缩放系数调整移动速度
    dev.crop.translateX = _initTranslateX + dx / (dev.crop.scale * 1.5);
    dev.crop.translateY = _initTranslateY + dy / (dev.crop.scale * 1.5);
    img.style.transform = 'scale(' + dev.crop.scale + ') translate(' + dev.crop.translateX + 'px, ' + dev.crop.translateY + 'px)';
  });

  // 拖拽释放
  document.addEventListener('mouseup', function(e) {
    if (_isDragging) {
      cell._justDragged = true;
      setTimeout(function() { cell._justDragged = false; }, 50);
    }
    _sX = undefined;
    _sY = undefined;
    cell.style.cursor = '';
    _isDragging = false;
  });
}

// 初始化
initWall();

// 打开UU远程（与main.html一致）
function openUU(uuDeviceId) {
  if (!uuDeviceId) { alert('该设备未设置UU设备ID'); return; }
  var url = 'uuycmgr://' + uuDeviceId;

  // 尝试方法1: window.open
  try {
    var opened = window.open(url);
    if (opened && !opened.closed) return;
  } catch(e) {}

  // 尝试方法2: 隐藏iframe
  try {
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = url;
    document.body.appendChild(iframe);
    setTimeout(function() { document.body.removeChild(iframe); }, 1000);
    return;
  } catch(e) {}

  // 尝试方法3: 创建链接并点击
  try {
    var a = document.createElement('a');
    a.href = url;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() { document.body.removeChild(a); }, 1000);
    return;
  } catch(e) {}
}
