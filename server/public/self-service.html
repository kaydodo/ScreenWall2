<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自助服务</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0c14;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
.container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: rgba(10,12,20,0.95);
}
.titlebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.titlebar-title {
  font-size: 14px;
  font-weight: 600;
  color: #e2e8f0;
}
.status-text {
  font-size: 12px;
  color: #888;
}
.status-text.online { color: #48bb78; }
.status-text.offline { color: #e06c75; }
.display-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  overflow: hidden;
}
.display-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  background: #000;
}
.display-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #111;
}
.no-signal {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #666;
  font-size: 14px;
  gap: 12px;
}
.no-signal-icon {
  font-size: 48px;
  opacity: 0.5;
}
.offline-watermark {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.offline-watermark.show { display: flex; }
.offline-watermark::before {
  content: '设备已离线';
  position: absolute;
  font-size: 28px;
  font-weight: 700;
  color: rgba(255,255,255,0.15);
  transform: rotate(-30deg);
  white-space: nowrap;
}
.grayscale {
  filter: grayscale(100%);
}
</style>
</head>
<body>
<div class="container">
  <div class="titlebar">
    <span class="titlebar-title">自助服务</span>
    <span class="status-text" id="statusText">等待连接...</span>
  </div>
  
  <div class="display-area">
    <div class="display-wrapper" id="displayWrapper">
      <img id="screenImg" src="" alt="屏幕画面">
      <div class="no-signal" id="noSignal">
        <div class="no-signal-icon">📺</div>
        <span>等待画面...</span>
      </div>
      <div class="offline-watermark" id="offlineWatermark"></div>
    </div>
  </div>
</div>

<script>
var ws = null;
var deviceId = null;
var deviceName = null;
var devices = {};
var frameHealCount = 0;
var FRAME_HEAL_THRESHOLD = 2;
var isOnline = false;

function getQueryParams() {
  var params = {};
  var search = window.location.search.substring(1);
  if (search) {
    search.split('&').forEach(function(pair) {
      var kv = pair.split('=');
      if (kv.length === 2) {
        params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
      }
    });
  }
  return params;
}

function connectWS() {
  var wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var wsUrl = wsProtocol + '//' + location.host;
  
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  
  ws.onopen = function() {
    document.getElementById('statusText').textContent = '已连接';
    document.getElementById('statusText').className = 'status-text online';
    
    if (deviceId) {
      ws.send(JSON.stringify({ type: 'setLevel', deviceId: deviceId, level: 2 }));
    }
  };
  
  ws.onclose = function() {
    document.getElementById('statusText').textContent = '连接断开';
    document.getElementById('statusText').className = 'status-text offline';
    setTimeout(connectWS, 3000);
  };
  
  ws.onerror = function() {
    document.getElementById('statusText').textContent = '连接错误';
    document.getElementById('statusText').className = 'status-text offline';
  };
  
  ws.onmessage = function(e) {
    if (e.data instanceof ArrayBuffer) {
      handleBinaryFrame(e.data);
    } else {
      handleJSONMessage(JSON.parse(e.data));
    }
  };
}

function handleBinaryFrame(data) {
  var view = new DataView(data);
  var arr = new Uint8Array(data);
  var frameType = arr[0];
  
  if (frameType === 0x10) {
    var devIdLen = arr[1];
    var devId = new TextDecoder().decode(new Uint8Array(data, 8, devIdLen));
    
    if (devId !== deviceId) return;
    
    var webpBuf = data.slice(8 + devIdLen);
    var blob = new Blob([webpBuf], { type: 'image/webp' });
    var blobUrl = URL.createObjectURL(blob);
    
    var img = document.getElementById('screenImg');
    var oldUrl = img._blobUrl;
    img.src = blobUrl;
    img._blobUrl = blobUrl;
    if (oldUrl) URL.revokeObjectURL(oldUrl);
    
    img.classList.remove('grayscale');
    document.getElementById('noSignal').style.display = 'none';
    document.getElementById('offlineWatermark').classList.remove('show');
    
    if (!isOnline) {
      frameHealCount++;
      if (frameHealCount >= FRAME_HEAL_THRESHOLD) {
        isOnline = true;
        updateOnlineStatus();
      }
    }
  }
}

function handleJSONMessage(msg) {
  if (msg.type === 'state') {
    if (msg.devices) {
      msg.devices.forEach(function(d) {
        devices[d.deviceId] = d;
      });
    }
    if (deviceId && devices[deviceId]) {
      var dev = devices[deviceId];
      deviceName = dev.deviceName || deviceName;
      isOnline = dev.online !== false;
      updateOnlineStatus();
      
      if (dev.screenshot && !document.getElementById('screenImg').src) {
        document.getElementById('screenImg').src = dev.screenshot;
      }
    }
  }
  
  if (msg.type === 'deviceList') {
    msg.devices.forEach(function(d) {
      devices[d.deviceId] = d;
    });
    if (deviceId && devices[deviceId]) {
      isOnline = devices[deviceId].online !== false;
      updateOnlineStatus();
    }
  }
  
  if (msg.type === 'wallStateUpdate') {
    if (msg.event === 'deviceOffline' && msg.deviceId === deviceId) {
      isOnline = false;
      frameHealCount = 0;
      updateOnlineStatus();
      if (msg.screenshot) {
        document.getElementById('screenImg').src = msg.screenshot;
        document.getElementById('screenImg').classList.add('grayscale');
      }
    }
  }
  
  if (msg.type === 'devicePreviewStatus' && msg.deviceId === deviceId) {
    if (msg.status === 'online') {
      isOnline = true;
      frameHealCount = FRAME_HEAL_THRESHOLD;
      updateOnlineStatus();
    } else if (msg.status === 'offline') {
      isOnline = false;
      frameHealCount = 0;
      updateOnlineStatus();
    }
  }
}

function updateOnlineStatus() {
  var statusText = document.getElementById('statusText');
  var img = document.getElementById('screenImg');
  var watermark = document.getElementById('offlineWatermark');
  
  if (isOnline) {
    statusText.textContent = deviceName + ' - 在线';
    statusText.className = 'status-text online';
    img.classList.remove('grayscale');
    watermark.classList.remove('show');
  } else {
    statusText.textContent = deviceName + ' - 离线';
    statusText.className = 'status-text offline';
    img.classList.add('grayscale');
    watermark.classList.add('show');
  }
}

function init() {
  var params = getQueryParams();
  deviceId = params.deviceId || null;
  deviceName = params.deviceName || '未知设备';
  
  if (deviceId) {
    document.title = '自助服务 - ' + deviceName;
  }
  
  connectWS();
}

init();
</script>
</body>
</html>
