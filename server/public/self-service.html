<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自助登号</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  user-select: none;
  -webkit-user-select: none;
  min-width: 280px;
}
.container {
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(10,12,20,0.88);
  display: flex;
  flex-direction: column;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  min-width: 280px;
}
.titlebar {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  background: rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
  gap: 10px;
}
#pageTitle {
  font-size: 14px;
  font-weight: 600;
  color: #e2e8f0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
}
.status-text {
  font-size: 12px;
  color: #888;
  margin-left: auto;
  display: none;
}
.status-text.online { color: #48bb78; }
.status-text.offline { color: #e06c75; }
.nav-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  flex-shrink: 0;
}
.nav-btn:hover {
  background: rgba(255,255,255,0.15);
}
.nav-btn:active {
  background: rgba(255,255,255,0.2);
}
.nav-btn svg {
  width: 18px;
  height: 18px;
  fill: #aaa;
}
.preview-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
  width: 100%;
  background: #000;
  padding: 8px;
}
.preview-img-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  aspect-ratio: 9/16;
  max-width: 100%;
  max-height: 100%;
}
.preview-img-wrapper img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.offline-watermark {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-15deg) scale(3);
  font-size: 52px;
  font-weight: 300;
  color: rgba(160,160,160,0.7);
  pointer-events: none;
  white-space: nowrap;
  text-shadow: 0 0 30px rgba(255,255,255,0.4);
}
.grayscale {
  filter: grayscale(100%);
}
</style>
</head>
<body>
<div class="container">
  <div class="titlebar">
    <span id="pageTitle">自助登号</span>
    <button class="nav-btn" id="backBtn" title="返回">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <button class="nav-btn" id="homeBtn" title="主页">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
  </div>
  
  <div class="preview-area" id="previewArea">
    <div class="preview-img-wrapper" id="previewWrapper">
      <img id="screenImg" src="" alt="屏幕画面">
    </div>
    <div class="offline-watermark" id="offlineWatermark">设备已离线</div>
  </div>
</div>

<script>
var ws = null;
var deviceId = null;
var deviceName = null;
var supportsKeyClient = false;
var devices = {};
var frameHealCount = 0;
var FRAME_HEAL_THRESHOLD = 2;
var isOnline = false;
var screenWidth = 1920;
var screenHeight = 1080;
var PREVIEW_ASPECT = 9 / 16;
var _previewLayoutTimer = null;

function updatePreviewLayout() {
  var area = document.getElementById('previewArea');
  var wrapper = document.getElementById('previewWrapper');
  if (!area || !wrapper) return;
  var st = window.getComputedStyle(area);
  var padTop = parseFloat(st.paddingTop) || 0;
  var padBottom = parseFloat(st.paddingBottom) || 0;
  var padLeft = parseFloat(st.paddingLeft) || 0;
  var padRight = parseFloat(st.paddingRight) || 0;
  var availW = area.clientWidth - padLeft - padRight;
  var availH = area.clientHeight - padTop - padBottom;
  if (availW <= 0 || availH <= 0) return;

  var w = availW;
  var h = w / PREVIEW_ASPECT;
  if (h > availH) {
    h = availH;
    w = h * PREVIEW_ASPECT;
  }
  wrapper.style.width = Math.floor(w) + 'px';
  wrapper.style.height = Math.floor(h) + 'px';
}

function scheduleUpdatePreviewLayout() {
  if (_previewLayoutTimer) clearTimeout(_previewLayoutTimer);
  _previewLayoutTimer = setTimeout(updatePreviewLayout, 50);
}

function getQueryParams() {
  var params = {};
  var search = window.location.search.substring(1);
  if (search) {
    search.split('&').forEach(function(pair) {
      var kv = pair.split('=');
      if (kv.length === 2) {
        params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
      }
    });
  }
  return params;
}

function connectWS() {
  var wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var wsUrl = wsProtocol + '//' + location.host;
  
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  
  ws.onopen = function() {
    if (deviceId) {
      ws.send(JSON.stringify({ type: 'subscribePreview', deviceId: deviceId }));
      ws.send(JSON.stringify({ type: 'setLevel', deviceId: deviceId, level: 2 }));
    }
  };
  
  ws.onclose = function() {
    setTimeout(connectWS, 3000);
  };
  
  ws.onerror = function() {
  };
  
  ws.onmessage = function(e) {
    if (e.data instanceof ArrayBuffer) {
      handleBinaryFrame(e.data);
    } else {
      handleJSONMessage(JSON.parse(e.data));
    }
  };
}

function handleBinaryFrame(data) {
  var view = new DataView(data);
  var arr = new Uint8Array(data);
  var frameType = arr[0];
  
  if (frameType === 0x10) {
    var devIdLen = arr[1];
    var flags = arr[2];
    var scrW = view.getUint16(4);
    var scrH = view.getUint16(6);
    var devId = new TextDecoder().decode(new Uint8Array(data, 8, devIdLen));
    
    if (devId !== deviceId) return;
    
    screenWidth = scrW || screenWidth;
    screenHeight = scrH || screenHeight;
    
    var webpBuf = data.slice(8 + devIdLen);
    var blob = new Blob([webpBuf], { type: 'image/webp' });
    var blobUrl = URL.createObjectURL(blob);
    
    var img = document.getElementById('screenImg');
    var oldUrl = img._blobUrl;
    img.src = blobUrl;
    img._blobUrl = blobUrl;
    if (oldUrl) URL.revokeObjectURL(oldUrl);
    
    img.classList.remove('grayscale');
    document.getElementById('offlineWatermark').style.display = 'none';
    
    if (!isOnline) {
      frameHealCount++;
      if (frameHealCount >= FRAME_HEAL_THRESHOLD) {
        isOnline = true;
        updateOnlineStatus();
      }
    }
  }
}

function handleJSONMessage(msg) {
  if (msg.type === 'state') {
    if (msg.devices) {
      msg.devices.forEach(function(d) {
        devices[d.deviceId] = d;
      });
    }
    if (deviceId && devices[deviceId]) {
      var dev = devices[deviceId];
      deviceName = dev.deviceName || deviceName;
      supportsKeyClient = dev.supportsKeyClient || false;
      isOnline = dev.online !== false;
      screenWidth = dev.screenWidth || screenWidth;
      screenHeight = dev.screenHeight || screenHeight;
      updateOnlineStatus();
      
      if (dev.screenshot && !document.getElementById('screenImg').src) {
        document.getElementById('screenImg').src = dev.screenshot;
      }
    }
  }
  
  if (msg.type === 'deviceList') {
    msg.devices.forEach(function(d) {
      devices[d.deviceId] = d;
    });
    if (deviceId && devices[deviceId]) {
      supportsKeyClient = devices[deviceId].supportsKeyClient || false;
      isOnline = devices[deviceId].online !== false;
      updateOnlineStatus();
    }
  }
  
  if (msg.type === 'wallStateUpdate') {
    if (msg.event === 'deviceOffline' && msg.deviceId === deviceId) {
      isOnline = false;
      frameHealCount = 0;
      updateOnlineStatus();
      if (msg.screenshot) {
        document.getElementById('screenImg').src = msg.screenshot;
        document.getElementById('screenImg').classList.add('grayscale');
      }
    }
  }
  
  if (msg.type === 'devicePreviewStatus' && msg.deviceId === deviceId) {
    if (msg.status === 'online') {
      isOnline = true;
      frameHealCount = FRAME_HEAL_THRESHOLD;
      updateOnlineStatus();
    } else if (msg.status === 'offline') {
      isOnline = false;
      frameHealCount = 0;
      updateOnlineStatus();
    }
  }
}

function updateOnlineStatus() {
  var img = document.getElementById('screenImg');
  var watermark = document.getElementById('offlineWatermark');
  
  if (isOnline) {
    img.classList.remove('grayscale');
    watermark.style.display = 'none';
  } else {
    img.classList.add('grayscale');
    watermark.style.display = 'block';
  }
}

function getClickPos(e) {
  var img = document.getElementById('screenImg');
  var imgRect = img.getBoundingClientRect();
  var cw = imgRect.width;
  var ch = imgRect.height;
  var imgAspect = screenWidth / screenHeight;
  var imgW, imgH, offsetX, offsetY;
  
  if (cw / ch > imgAspect) {
    imgH = ch; imgW = ch * imgAspect; offsetX = (cw - imgW) / 2; offsetY = 0;
  } else {
    imgW = cw; imgH = cw / imgAspect; offsetX = 0; offsetY = (ch - imgH) / 2;
  }
  
  var clickX = e.clientX - imgRect.left - offsetX;
  var clickY = e.clientY - imgRect.top - offsetY;
  
  if (clickX < 0 || clickY < 0 || clickX > imgW || clickY > imgH) return null;
  return { x: Math.round((clickX / imgW) * screenWidth), y: Math.round((clickY / imgH) * screenHeight) };
}

function sendMouse(type, x, y, extra) {
  if (!deviceId || !supportsKeyClient || !isOnline) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    var payload = { type: type, deviceId: deviceId, x: x, y: y, previewWidth: screenWidth, previewHeight: screenHeight };
    if (extra) Object.assign(payload, extra);
    ws.send(JSON.stringify(payload));
  }
}

function sendKey(key) {
  if (!deviceId || !supportsKeyClient || !isOnline) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'keyPress', deviceId: deviceId, key: key }));
  }
}

function handlePreviewClick(e) {
  var pos = getClickPos(e);
  if (pos && supportsKeyClient && isOnline) {
    sendMouse('mouseLeft', pos.x, pos.y);
  }
}

function setupMouseEvents() {
  var previewArea = document.getElementById('previewArea');
  var img = document.getElementById('screenImg');
  
  img.onclick = handlePreviewClick;
  
  previewArea.oncontextmenu = function(e) { e.preventDefault(); };
  
  previewArea.onwheel = function(e) {
    e.preventDefault();
    if (supportsKeyClient && isOnline) {
      var delta = e.deltaY > 0 ? -120 : 120;
      sendMouse('mouseScroll', 0, 0, { delta: delta });
    }
  };
  
  previewArea.onmousedown = function(e) {
    if (e.button === 2) {
      e.preventDefault();
      if (supportsKeyClient && isOnline) {
        var pos = getClickPos(e);
        if (pos) sendMouse('mouseRight', pos.x, pos.y);
      }
    }
  };
}

function init() {
  var params = getQueryParams();
  deviceId = params.deviceId || 'MUMU-service';
  deviceName = params.deviceName || 'MUMU 模拟器';
  
  document.getElementById('pageTitle').textContent = deviceName + ' - 自助登号';
  document.title = '自助登号 - ' + deviceName;
  
  document.getElementById('backBtn').onclick = function() {
    sendKey('Back');
  };
  
  document.getElementById('homeBtn').onclick = function() {
    sendKey('Home');
  };
  
  connectWS();
  setupMouseEvents();
  updatePreviewLayout();
  window.addEventListener('resize', scheduleUpdatePreviewLayout);
}

init();
</script>
</body>
</html>
