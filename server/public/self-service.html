<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自助登号</title>
<script>
// 强制设置窗口大小 520x960 (9:16比例，高度960)
window.addEventListener('load', function() {
  setTimeout(function() {
    try {
      window.resizeTo(520, 960);
      setTimeout(function() {
        window.resizeTo(520, 960);
        // 强制移动窗口到屏幕中央
        moveToCenter();
      }, 300);
    } catch(e) {}
  }, 500);
});

// 移动窗口到屏幕中央
function moveToCenter() {
  try {
    var screenW = window.screen.availWidth;
    var screenH = window.screen.availHeight;
    var winW = 520;
    var winH = 960;
    
    var posX = Math.floor((screenW - winW) / 2);
    var posY = Math.floor((screenH - winH) / 2);
    
    window.moveTo(posX, posY);
    
    setTimeout(function() {
      window.moveTo(posX, posY);
    }, 500);
  } catch(e) {}
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  user-select: none;
  -webkit-user-select: none;
  min-width: 280px;
}
.container {
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(10,12,20,0.88);
  display: flex;
  flex-direction: column;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  min-width: 280px;
}
.titlebar {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  background: rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
  gap: 10px;
}
.nav-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  flex-shrink: 0;
}
.nav-btn:hover {
  background: rgba(255,255,255,0.15);
}
.nav-btn:active {
  background: rgba(255,255,255,0.2);
}
.nav-btn svg {
  width: 18px;
  height: 18px;
  fill: #aaa;
}
.device-select-container {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  margin-left: 16px;
}
.device-select-label {
  font-size: 14px;
  color: #ccc;
  flex-shrink: 0;
}
.device-select {
  flex: 1;
  min-width: 0;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  color: #fff;
  font-size: 13px;
  padding: 6px 8px;
  outline: none;
  cursor: pointer;
}
.device-select:hover {
  background: rgba(255,255,255,0.12);
}
.device-select option {
  background: #1a1a2e;
  color: #fff;
  font-size: 13px;
}
.preview-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
  width: 100%;
  background: #000;
  padding: 8px;
}
.preview-img-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  aspect-ratio: 9/16;
  max-width: 100%;
  max-height: 100%;
  z-index: 2; /* 确保画面在提示文字之上 */
}
.preview-img-wrapper img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.offline-watermark {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-15deg) scale(3);
  font-size: 52px;
  font-weight: 300;
  color: rgba(160,160,160,0.7);
  pointer-events: none;
  white-space: nowrap;
  text-shadow: 0 0 30px rgba(255,255,255,0.4);
}
.no-mumu-hint {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 18px;
  color: #888;
  text-align: center;
  pointer-events: none;
  white-space: nowrap;
  z-index: 1;
}
.grayscale {
  filter: grayscale(100%);
}
#screenImg {
  background: transparent;
}
#screenImg[src=""],
#screenImg:not([src]) {
  opacity: 0;
}
</style>
</head>
<body>
<div class="container">
  <div class="titlebar">
    <button class="nav-btn" id="backBtn" title="返回">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <button class="nav-btn" id="homeBtn" title="主页">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
    <button class="nav-btn" id="recentsBtn" title="任务">
      <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
    </button>
    <div class="device-select-container">
      <div class="device-select-label">二维码来源</div>
      <select class="device-select" id="deviceSelect">
      </select>
    </div>
  </div>
  
  <div class="preview-area" id="previewArea">
    <div class="no-mumu-hint">请检查MUMU服务是否启动</div>
    <div class="preview-img-wrapper" id="previewWrapper">
      <img id="screenImg" src="" alt="屏幕画面">
    </div>
    <div class="offline-watermark" id="offlineWatermark">设备已离线</div>
  </div>
</div>

<script>
var ws = null;
var originalDeviceId = null;  // 最初从URL获取的电脑客户端ID（业务发起方）
var originalDeviceName = null;  // 最初从URL获取的电脑客户端名称
var deviceId = null;  // 当前下拉选择的设备ID（业务设备，需要截图的设备）
var previewDeviceId = 'MUMU-service';  // 固定订阅MUMU的画面
var deviceName = null;
var devices = {};
var frameHealCount = 0;
var FRAME_HEAL_THRESHOLD = 2;
var isOnline = false;
var screenWidth = 1920;
var screenHeight = 1080;
var PREVIEW_ASPECT = 9 / 16;
var _previewLayoutTimer = null;
var _autoLoginSuccess = false; // 自动登录成功标记

// 检查 URL 参数中的自动登录 token
function checkAutoLoginToken() {
  const params = new URLSearchParams(window.location.search);
  const auto = params.get('auto');
  const token = params.get('token');
  
  if (auto === '1' && token) {
    try {
      // 解码 token（格式：base64(deviceId:timestamp)）
      const decoded = atob(token);
      const parts = decoded.split(':');
      if (parts.length >= 2) {
        const deviceId = parts[0];
        const timestamp = parseInt(parts[1]);
        const now = Math.floor(Date.now() / 1000);
        // token 有效期 30 秒
        if (now - timestamp < 30) {
          _autoLoginSuccess = true;
          console.log('[自动登录] token 验证成功，设备ID:', deviceId);
          return true;
        } else {
          console.warn('[自动登录] token 已过期');
        }
      }
    } catch (e) {
      console.error('[自动登录] token 解析失败:', e.message);
    }
  }
  return false;
}

// 页面加载时自动检查自动登录
checkAutoLoginToken();

function naturalCompare(a, b) {
  const strA = String(a);
  const strB = String(b);

  const replaceCircledNums = (s) => {
    const map = {
      '①':1,'②':2,'③':3,'④':4,'⑤':5,'⑥':6,'⑦':7,'⑧':8,'⑨':9,
      '⑩':10,'⑪':11,'⑫':12,'⑬':13,'⑭':14,'⑮':15,'⑯':16,'⑰':17,'⑱':18,'⑲':19,'⑳':20
    };
    return s.replace(/[①-⑳⑩-⑳]/g, c => map[c] !== undefined ? String(map[c]) : c)
            .replace(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g, c => map[c] !== undefined ? String(map[c]) : c);
  };

  const split = (s) => {
    const normalized = replaceCircledNums(s);
    const m = normalized.match(/^([\D]*?)(\d+)(.*)$/);
    if (m) {
      return { prefix: m[1], num: parseInt(m[2], 10), suffix: m[3] };
    }
    return { prefix: normalized, num: null, suffix: '' };
  };

  const pA = split(strA);
  const pB = split(strB);

  const prefixCmp = pA.prefix.localeCompare(pB.prefix, 'zh-CN');
  if (prefixCmp !== 0) return prefixCmp;

  if (pA.num !== null && pB.num !== null) {
    if (pA.num !== pB.num) return pA.num - pB.num;
    return pA.suffix.localeCompare(pB.suffix, 'zh-CN');
  }
  if (pA.num !== null) return -1;
  if (pB.num !== null) return 1;

  return strA.localeCompare(strB, 'zh-CN');
}

function updateDeviceSelect() {
  const select = document.getElementById('deviceSelect');
  if (!select) return;

  const allDevices = Object.values(devices);
  const onlineDevices = allDevices.filter(d => d.online && d.deviceId !== 'MUMU-service');

  const sortedDevices = [...onlineDevices].sort((a, b) => {
    const aIsMe = a.deviceId === deviceId;
    const bIsMe = b.deviceId === deviceId;
    if (aIsMe && !bIsMe) return -1;
    if (!aIsMe && bIsMe) return 1;
    return naturalCompare(a.deviceName, b.deviceName);
  });

  const currentValue = select.value || deviceId;

  select.innerHTML = '';
  sortedDevices.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.deviceId;
    if (d.deviceId === deviceId) {
      opt.textContent = (d.deviceName || d.deviceId) + ' (本机)';
    } else {
      opt.textContent = d.deviceName || d.deviceId;
    }
    select.appendChild(opt);
  });

  if (currentValue && sortedDevices.some(d => d.deviceId === currentValue)) {
    select.value = currentValue;
  } else if (deviceId && sortedDevices.some(d => d.deviceId === deviceId)) {
    select.value = deviceId;
  }
}

function onDeviceSelectChange() {
  const select = document.getElementById('deviceSelect');
  if (!select) return;

  const newDeviceId = select.value;
  if (!newDeviceId) return;

  deviceId = newDeviceId;

  if (ws && ws.readyState === WebSocket.OPEN) {
    var businessDev = devices[deviceId];
    var businessDevName = businessDev ? businessDev.deviceName : deviceId;
    ws.send(JSON.stringify({ 
      type: 'selfServiceInit', 
      operatorId: originalDeviceId,
      operatorName: originalDeviceName,
      businessId: deviceId,
      businessName: businessDevName 
    }));
  }
}

function updatePreviewLayout() {
  var area = document.getElementById('previewArea');
  var wrapper = document.getElementById('previewWrapper');
  if (!area || !wrapper) return;
  var st = window.getComputedStyle(area);
  var padTop = parseFloat(st.paddingTop) || 0;
  var padBottom = parseFloat(st.paddingBottom) || 0;
  var padLeft = parseFloat(st.paddingLeft) || 0;
  var padRight = parseFloat(st.paddingRight) || 0;
  var availW = area.clientWidth - padLeft - padRight;
  var availH = area.clientHeight - padTop - padBottom;
  if (availW <= 0 || availH <= 0) return;

  var w = availW;
  var h = w / PREVIEW_ASPECT;
  if (h > availH) {
    h = availH;
    w = h * PREVIEW_ASPECT;
  }
  wrapper.style.width = Math.floor(w) + 'px';
  wrapper.style.height = Math.floor(h) + 'px';
}

function scheduleUpdatePreviewLayout() {
  if (_previewLayoutTimer) clearTimeout(_previewLayoutTimer);
  _previewLayoutTimer = setTimeout(updatePreviewLayout, 50);
}

function getQueryParams() {
  var params = {};
  var search = window.location.search.substring(1);
  if (search) {
    search.split('&').forEach(function(pair) {
      var kv = pair.split('=');
      if (kv.length === 2) {
        params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
      }
    });
  }
  return params;
}

function connectWS() {
  var wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var wsUrl = wsProtocol + '//' + location.host + '/ws/browser';
  
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  
  ws.onopen = function() {
    // 先只发送订阅消息，等收到 state 消息后再发送 selfServiceInit
    if (previewDeviceId) {
      ws.send(JSON.stringify({ type: 'subscribePreview', deviceId: previewDeviceId }));
      ws.send(JSON.stringify({ type: 'setLevel', deviceId: previewDeviceId, level: 2 }));
    }
  };
  
  ws.onclose = function() {
    setTimeout(connectWS, 3000);
  };
  
  ws.onerror = function() {
  };
  
  ws.onmessage = function(e) {
    if (e.data instanceof ArrayBuffer) {
      handleBinaryFrame(e.data);
    } else {
      handleJSONMessage(JSON.parse(e.data));
    }
  };
}

function handleBinaryFrame(data) {
  var view = new DataView(data);
  var arr = new Uint8Array(data);
  var frameType = arr[0];
  
  if (frameType === 0x10) {
    var devIdLen = arr[1];
    var flags = arr[2];
    var scrW = view.getUint16(4);
    var scrH = view.getUint16(6);
    var devId = new TextDecoder().decode(new Uint8Array(data, 8, devIdLen));
    
    if (devId !== previewDeviceId) return;
    
    screenWidth = scrW || screenWidth;
    screenHeight = scrH || screenHeight;
    
    var webpBuf = data.slice(8 + devIdLen);
    var blob = new Blob([webpBuf], { type: 'image/webp' });
    var blobUrl = URL.createObjectURL(blob);
    
    var img = document.getElementById('screenImg');
    var oldUrl = img._blobUrl;
    img.src = blobUrl;
    img._blobUrl = blobUrl;
    if (oldUrl) URL.revokeObjectURL(oldUrl);
    
    img.classList.remove('grayscale');
    document.getElementById('offlineWatermark').style.display = 'none';
    
    if (!isOnline) {
      frameHealCount++;
      if (frameHealCount >= FRAME_HEAL_THRESHOLD) {
        isOnline = true;
        updateOnlineStatus();
      }
    }
  }
}

function handleJSONMessage(msg) {
  if (msg.type === 'state') {
    if (msg.devices) {
      msg.devices.forEach(function(d) {
        devices[d.deviceId] = d;
      });
    }
    updateDeviceSelect();
    
    // 收到 state 消息后发送 selfServiceInit
    var businessDev = devices[deviceId];
    var businessDevName = businessDev ? businessDev.deviceName : deviceId;
    ws.send(JSON.stringify({ 
      type: 'selfServiceInit', 
      operatorId: originalDeviceId,
      operatorName: originalDeviceName,
      businessId: deviceId,
      businessName: businessDevName 
    }));
    
    if (previewDeviceId && devices[previewDeviceId]) {
      var dev = devices[previewDeviceId];
      isOnline = dev.online !== false;
      screenWidth = dev.screenWidth || screenWidth;
      screenHeight = dev.screenHeight || screenHeight;
      updateOnlineStatus();
      
      if (dev.screenshot && !document.getElementById('screenImg').src) {
        document.getElementById('screenImg').src = dev.screenshot;
      }
    }
  }
  
  if (msg.type === 'deviceList') {
    msg.devices.forEach(function(d) {
      devices[d.deviceId] = d;
    });
    updateDeviceSelect();
    if (previewDeviceId && devices[previewDeviceId]) {
      isOnline = devices[previewDeviceId].online !== false;
      updateOnlineStatus();
    }
  }
  
  if (msg.type === 'wallStateUpdate') {
    if (msg.event === 'deviceOffline' && msg.deviceId === previewDeviceId) {
      isOnline = false;
      frameHealCount = 0;
      updateOnlineStatus();
      if (msg.screenshot) {
        document.getElementById('screenImg').src = msg.screenshot;
        document.getElementById('screenImg').classList.add('grayscale');
      }
    }
  }
  
  if (msg.type === 'devicePreviewStatus' && msg.deviceId === previewDeviceId) {
    if (msg.status === 'online') {
      isOnline = true;
      frameHealCount = FRAME_HEAL_THRESHOLD;
      updateOnlineStatus();
    } else if (msg.status === 'offline') {
      isOnline = false;
      frameHealCount = 0;
      updateOnlineStatus();
    }
  }
}

function updateOnlineStatus() {
  var img = document.getElementById('screenImg');
  var watermark = document.getElementById('offlineWatermark');
  
  if (isOnline) {
    img.classList.remove('grayscale');
    watermark.style.display = 'none';
  } else {
    img.classList.add('grayscale');
    watermark.style.display = 'block';
  }
}

function getClickPos(e) {
  var img = document.getElementById('screenImg');
  var imgRect = img.getBoundingClientRect();
  var cw = imgRect.width;
  var ch = imgRect.height;
  var imgAspect = screenWidth / screenHeight;
  var imgW, imgH, offsetX, offsetY;
  
  if (cw / ch > imgAspect) {
    imgH = ch; imgW = ch * imgAspect; offsetX = (cw - imgW) / 2; offsetY = 0;
  } else {
    imgW = cw; imgH = cw / imgAspect; offsetX = 0; offsetY = (ch - imgH) / 2;
  }
  
  var clickX = e.clientX - imgRect.left - offsetX;
  var clickY = e.clientY - imgRect.top - offsetY;
  
  if (clickX < 0 || clickY < 0 || clickX > imgW || clickY > imgH) return null;
  return { x: Math.round((clickX / imgW) * screenWidth), y: Math.round((clickY / imgH) * screenHeight) };
}

function sendMouse(type, x, y, extra) {
  if (!previewDeviceId || !isOnline) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    var businessDev = devices[deviceId];
    var businessDevName = businessDev ? businessDev.deviceName : deviceId;
    
    var payload = { 
      type: type, 
      deviceId: previewDeviceId,        // 鼠标操作发送给 MU 客户端
      operatorId: originalDeviceId,      // 业务发起方 ID
      operatorName: originalDeviceName,    // 业务发起方名称
      businessId: deviceId,              // 业务设备（下拉选择的设备ID，需要截图的设备）
      businessName: businessDevName,     // 业务设备名称
      x: x, 
      y: y, 
      previewWidth: screenWidth, 
      previewHeight: screenHeight 
    };
    if (extra) Object.assign(payload, extra);
    ws.send(JSON.stringify(payload));
  }
}

function sendKey(key) {
  if (!previewDeviceId || !isOnline) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'keyClick', deviceId: previewDeviceId, key: key }));
  }
}

function setupMouseEvents() {
  var previewArea = document.getElementById('previewArea');
  var img = document.getElementById('screenImg');
  
  previewArea.oncontextmenu = function(e) { e.preventDefault(); };
  
  previewArea.onwheel = function(e) {
    e.preventDefault();
    if (isOnline) {
      var delta = e.deltaY > 0 ? -120 : 120;
      sendMouse('mouseScroll', 0, 0, { delta: delta });
    }
  };
  
  // 滑动操作相关变量
  var swipeStartX = 0;
  var swipeStartY = 0;
  var swipeStartTime = 0;
  var isDragging = false;
  
  previewArea.onmousedown = function(e) {
    e.preventDefault();
    var pos = getClickPos(e);
    if (pos && isOnline && e.button === 0) { // 只处理左键
      isDragging = true;
      swipeStartX = pos.x;
      swipeStartY = pos.y;
      swipeStartTime = Date.now();
    }
  };
  
  previewArea.onmouseup = function(e) {
    if (!isDragging) return;
    isDragging = false;
    var pos = getClickPos(e);
    if (pos && isOnline) {
      var deltaTime = Date.now() - swipeStartTime;
      if (deltaTime > 100 && (Math.abs(pos.x - swipeStartX) > 10 || Math.abs(pos.y - swipeStartY) > 10)) {
        // 滑动，发送滑动事件
        sendMouse('mouseSwipe', swipeStartX, swipeStartY, { 
          x2: pos.x, y2: pos.y, duration: deltaTime });
      } else {
        // 点击
        sendMouse('mouseClick', pos.x, pos.y);
      }
    }
  };
  
  previewArea.onmouseleave = function(e) {
    isDragging = false;
  };
}

function init() {
  var params = getQueryParams();
  originalDeviceId = params.deviceId || 'MUMU-service';
  originalDeviceName = params.deviceName || '';
  deviceId = originalDeviceId;
  previewDeviceId = 'MUMU-service';
  deviceName = originalDeviceName;
  
  document.getElementById('backBtn').onclick = function() {
    sendKey('Back');
  };
  
  document.getElementById('homeBtn').onclick = function() {
    sendKey('Home');
  };
  
  document.getElementById('recentsBtn').onclick = function() {
    sendKey('Recent');
  };
  
  document.getElementById('deviceSelect').onchange = function() {
    onDeviceSelectChange();
  };
  
  connectWS();
  setupMouseEvents();
  updatePreviewLayout();
  window.addEventListener('resize', scheduleUpdatePreviewLayout);

  window.addEventListener('beforeunload', function() {
    var img = document.getElementById('screenImg');
    if (img && img._blobUrl) {
      URL.revokeObjectURL(img._blobUrl);
      img._blobUrl = null;
    }
    if (_previewLayoutTimer) {
      clearTimeout(_previewLayoutTimer);
    }
  });
}

init();
</script>
</body>
</html>
